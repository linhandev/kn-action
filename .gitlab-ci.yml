spec:
  inputs:
    target:
      type: string
      default: "llvm"
      options:
        - "llvm"
        - "kotlin"
        - "test-prepare-repo"
      description: "Select CI profile to run"
    llvm_clean_build:
      type: boolean
      default: false
      description: "When true, wipe the LLVM workspace before building (forces full rebuild, skips cache check)."
    oh_version:
      type: string
      default: "204"
      description: "OpenHarmony / essentials id for final archive naming (platform_package.sh OH_VERSION)."
    llvm_manifest:
      type: string
      default: "llvm-1914.xml"
      options:
        - "llvm-1914.xml"
        - "llvm-1914-bare.xml"
        - "llvm-1917.xml"
      description: "Manifest file for LLVM repo sync (llvm-1914.xml / llvm-1914-bare.xml = KMP LLVM 19.1.4; llvm-1917.xml = OH LLVM 19.1.7)"
    llvm_skip_pipeline:
      type: boolean
      default: true
      description: "When true: LLVM/OHOS jobs are omitted from the pipeline (see .gitlab/ci/llvm.yml). Kotlin jobs still run."
    kotlin_use_fresh_llvm:
      type: boolean
      default: true
      description: "When true, kotlin-build.sh resolves OH LLVM (llvm-artifacts.env, then LAN artifact server) and rewrites kotlin-native/gradle.properties. When false, Konan uses checkout defaults."
---
# GitLab CI — kn-action (LAN). Runner fleet: AGENTS.md → "Four-host runner matrix".
# prepare-repo tests: Kotlin runners only, three tags each (kotlin + OS + arch).
#
# Workflows: merge requests (path-gated), manual “Run pipeline” (web), no push pipelines for LLVM paths (avoids duplicate push+MR runs).
# Per-job rules gate prepare-repo vs LLVM via path changes; web uses TARGET.
#
# Manual LLVM-only: Run pipeline (web) with input target=llvm.
# Manual prepare-repo tests: Run pipeline (web) with input target=test-prepare-repo.
#
# Scheduled LLVM clean matrix: CI/CD → Schedules with variables TARGET=llvm,
# LLVM_DAILY_CLEAN_SCHEDULE=true (see .gitlab/ci/llvm.yml). Example (Asia/Shanghai = UTC+8):
#   glab schedule create --cron "0 2 * * *" --cronTimeZone "Asia/Shanghai" --ref develop \
#     --description "LLVM clean matrix (daily)" \
#     --variable "TARGET:llvm" --variable "LLVM_DAILY_CLEAN_SCHEDULE:true"

variables:
  TARGET: "$[[ inputs.target ]]"
  LLVM_CLEAN_BUILD: "$[[ inputs.llvm_clean_build ]]"
  OH_VERSION: "$[[ inputs.oh_version ]]"
  LLVM_MANIFEST: "$[[ inputs.llvm_manifest ]]"
  LLVM_SKIP_PIPELINE: "$[[ inputs.llvm_skip_pipeline ]]"
  KOTLIN_USE_FRESH_LLVM: "$[[ inputs.kotlin_use_fresh_llvm ]]"

# Windows shell (bash): GitLab Runner often runs as LocalSystem; the internal clone step may not
# inherit the same PATH as an interactive session, so `mkdir`/`find` from Git usr\bin are missing.
# This hook runs before get_sources (GitLab 16.1+). Non-Windows jobs: `command -v mkdir` succeeds → no-op.
# Shell executor (often LocalSystem): always put Git *usr\bin* before System32 so Bash gets GNU mkdir/find, not Windows .exe.
# GRADLE_OPTS: no persistent Gradle daemon (locks ci-workspace on reuse); kotlin-build.sh defaults match.
.windows-gitbash-pre-sources:
  hooks:
    pre_get_sources_script:
      - |
        if [ -d /c/PROGRA~1/Git/usr/bin ]; then
          export PATH="/c/PROGRA~1/Git/usr/bin:/c/PROGRA~1/Git/bin:/c/PROGRA~1/Git/mingw64/bin:${PATH:-}"
        fi
        export GRADLE_OPTS="${GRADLE_OPTS:--Dorg.gradle.daemon=false -Dorg.gradle.internal.repository.max.tentatives=16 -Dorg.gradle.internal.repository.initial.backoff=5000 -Dorg.spdx.useJARLicenseInfoOnly=true}"

workflow:
  # Cancel jobs from the previous pipeline on the same branch when a new commit lands (e.g. MR updates).
  # Requires project setting CI/CD → General pipelines → "Auto-cancel redundant pipelines" (usually on).
  # With `interruptible`, only jobs marked `interruptible: true` are cancelled; LLVM compile jobs use that.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # llvm-sync (origin→GL mirror) disabled; re-add with sync:llvm:origin-to-gl rules in .gitlab/ci/llvm.yml.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $LLVM_DAILY_CLEAN_SCHEDULE == "true" && $TARGET == "llvm"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    # Prepare-repo tests (independent path set)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .github/actions/prepare-repo/**/*
        - .github/workflows/test-prepare-repo.yml
    # LLVM pipeline (specific paths, not .gitlab/ci/**/*)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml
        - .github/workflows/build-llvm.yml
        - .gitlab/ci/llvm.yml
        - .gitlab/ci/prepare-repo.yml
        - manifest/**/*
        - scripts/ci/llvm-build.sh
        - scripts/ci/llvm-cross-copy.sh
        - scripts/ci/llvm-provide-artifacts.sh
        - scripts/ci/ohos-test-build.sh
        - scripts/ci/hdc-verify-all.sh
        - scripts/setup-repo-tool.sh
        - scripts/platform_package.sh
    # Kotlin pipeline (specific paths)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/kotlin.yml
        - .github/workflows/build-kotlin.yml
        - infra/docker/kotlin-linux-builder/**/*
        - scripts/ci/kotlin-build.sh
        - scripts/ci/kotlin-hap-smoke-test.sh
        - scripts/proxy.init.gradle
        - scripts/rewrite-gradle-wrapper-reposlite.sh
        - patches/**/*
        - .github/actions/prepare-repo/**/*
        - .github/actions/upload-artifact-local/**/*
        - .github/actions/download-artifact-local/**/*
    - when: never

include:
  - local: .gitlab/ci/prepare-repo.yml
  - local: .gitlab/ci/llvm.yml
  - local: .gitlab/ci/kotlin.yml

stages:
  - test
  - llvm_build
  - llvm_artifact
  - llvm_verify
  - kotlin_build
  - kotlin_verify
