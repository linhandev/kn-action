# GitLab CI — kn-action (LAN). Runner fleet: AGENTS.md → "Four-host runner matrix".
# prepare-repo tests: Kotlin runners only, three tags each (kotlin + OS + arch).
#
# Workflows: merge requests and manual “Run pipeline” only (no push / schedule).
# Per-job rules gate prepare-repo vs LLVM via path changes; web uses KNACTION_CI_PROFILE.
#
# Manual LLVM-only: Run pipeline (web) with variable KNACTION_CI_PROFILE=llvm.
# Manual prepare-repo tests: Run pipeline (web) with KNACTION_CI_PROFILE=test-prepare-repo.

variables:
  KNACTION_CI_PROFILE:
    description: "Select CI profile to run"
    value: "llvm"
    options:
      - "llvm"
      - "test-prepare-repo"
      - "llvm-sync"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $KNACTION_CI_PROFILE == "llvm-sync"'
    - if: '$CI_PIPELINE_SOURCE == "api" && $KNACTION_CI_PROFILE == "llvm-sync"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .github/actions/prepare-repo/**/*
        - .github/workflows/test-prepare-repo.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml
        - .github/workflows/build-llvm.yml
        - .gitlab/ci/**/*
        - scripts/ci/llvm-build.sh
        - scripts/ci/download-artifact-local.sh
        - scripts/ci/llvm-artifact-refs.sh
        - scripts/ci/llvm-cross-copy.sh
        - scripts/ci/ohos-test-build.sh
        - scripts/ci/hdc-verify-all.sh
        - scripts/setup-repo-tool.sh
        - scripts/setup-llvm-ccache.sh
        - scripts/platform_package.sh
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/kotlin.yml
        - .github/workflows/build-kotlin.yml
        - scripts/ci/kotlin-build.sh
        - scripts/proxy.init.gradle
        - scripts/rewrite-gradle-wrapper-reposlite.sh
        - patches/**/*
        - .github/actions/prepare-repo/**/*
        - .github/actions/upload-artifact-local/**/*
        - .github/actions/download-artifact-local/**/*
    - when: never

include:
  - local: .gitlab/ci/prepare-repo.yml
  - local: .gitlab/ci/llvm.yml
  # - local: .gitlab/ci/kotlin.yml

stages:
  - test
  - build
  - llvm_merge
  - llvm_verify

