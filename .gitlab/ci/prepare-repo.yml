.prepare-repo-test:
  stage: test
  interruptible: true
  rules:
    - if: '$KNACTION_CI_PROFILE == "test-prepare-repo"'
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -t ed25519,ecdsa,rsa gitcode.com >> ~/.ssh/known_hosts 2>/dev/null || true
    - |
      if [ -n "${GITCODE_SSH_PRIVATE_KEY:-}" ]; then
        printf '%s\n' "$GITCODE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/id_ed25519
      fi
    - mkdir -p "${CI_PROJECT_DIR}/.ci-tmp"
  script:
    - export WORKSPACE_DIR="${CI_PROJECT_DIR}/.ci-tmp/prepare-repo-workspace"
    - export LOCAL_REFERENCE_DIR="${CI_PROJECT_DIR}/.ci-tmp/git-ci"
    - rm -rf "$WORKSPACE_DIR" || true
    - mkdir -p "$LOCAL_REFERENCE_DIR"
    - bash .github/actions/prepare-repo/test.sh

test:prepare-repo:kotlin:linux:
  extends: .prepare-repo-test
  tags:
    - kotlin
    - linux
    - x64

test:prepare-repo:kotlin:windows:
  extends: .prepare-repo-test
  tags:
    - kotlin
    - windows
    - x64

test:prepare-repo:kotlin:macos:
  extends: .prepare-repo-test
  tags:
    - kotlin
    - macos
    - arm64

test:prepare-repo:kotlin:macos-x64:
  extends: .prepare-repo-test
  tags:
    - kotlin
    - macos
    - x64
