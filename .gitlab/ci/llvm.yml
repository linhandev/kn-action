# Ported from .github/workflows/build-llvm.yml (build → llvm-artifact-refs → cross-copy → ohos-test → hdc).
#
# Web + MR only for LLVM (no branch push pipeline; see root .gitlab-ci.yml workflow). Web: set KNACTION_CI_PROFILE=llvm for LLVM-only (no prepare-repo matrix).
#
# Linux Docker: if upload to ARTIFACT_SERVER_URL fails, use runners.docker.network_mode=host
# (or routing so the container can reach the LAN artifact host).
#
# LLVM compile matrix is off by default (see root variables KNACTION_LLVM_RUN_BUILD). Set it true
# to run build:llvm:*; otherwise llvm:artifact-refs resolves latest outer tars per OS via artifact-server
# regex (same patterns as GHA skip_build).

.llvm-build-matrix-common:
  stage: build # TODO: change to build-llvm
  interruptible: true
  timeout: 6h
  # Same as scripts/ci/llvm-build.sh default and GHA build-llvm.yml: repo init --reference when present.
  # Use before_script so $HOME expands (GitLab variables: do not expand $HOME reliably).
  before_script:
    - export LOCAL_REFERENCE_DIR="${HOME}/git/ci/llvm-project-kmp"
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"
    # Default -ffdx removes ignored paths and deletes untracked llvm/; drop -x so .gitignore keeps
    # llvm/, .ccache/, and bin/ (repo tool) across jobs on the same runner checkout.
    GIT_CLEAN_FLAGS: "-ffd"

.llvm-build-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $KNACTION_CI_PROFILE == "llvm"'
    # - if: '$CI_PIPELINE_SOURCE == "push"'
    #   changes:
    #     - .github/workflows/build-llvm.yml
    #     - .gitlab-ci.yml
    #     - .gitlab/ci/**/*
    #     - scripts/ci/llvm-build.sh
    #     - scripts/ci/download-artifact-local.sh
    #     - scripts/ci/llvm-artifact-refs.sh
    #     - scripts/ci/artifact-server-latest.sh
    #     - scripts/ci/llvm-cross-copy.sh
    #     - scripts/ci/ohos-test-build.sh
    #     - scripts/ci/hdc-verify-all.sh
    #     - scripts/setup-repo-tool.sh
    #     - scripts/setup-llvm-ccache.sh
    #     - scripts/platform_package.sh
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .github/workflows/build-llvm.yml
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
        - scripts/ci/llvm-build.sh
        - scripts/ci/download-artifact-local.sh
        - scripts/ci/llvm-artifact-refs.sh
        - scripts/ci/artifact-server-latest.sh
        - scripts/ci/llvm-cross-copy.sh
        - scripts/ci/ohos-test-build.sh
        - scripts/ci/hdc-verify-all.sh
        - scripts/setup-repo-tool.sh
        - scripts/setup-llvm-ccache.sh
        - scripts/platform_package.sh

# Same triggers as .llvm-build-rules but compile jobs are skipped unless KNACTION_LLVM_RUN_BUILD=true.
.llvm-compile-job-rules:
  rules:
    - if: '$KNACTION_LLVM_RUN_BUILD != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $KNACTION_CI_PROFILE == "llvm"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .github/workflows/build-llvm.yml
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
        - scripts/ci/llvm-build.sh
        - scripts/ci/download-artifact-local.sh
        - scripts/ci/llvm-artifact-refs.sh
        - scripts/ci/artifact-server-latest.sh
        - scripts/ci/llvm-cross-copy.sh
        - scripts/ci/ohos-test-build.sh
        - scripts/ci/hdc-verify-all.sh
        - scripts/setup-repo-tool.sh
        - scripts/setup-llvm-ccache.sh
        - scripts/platform_package.sh

sync:llvm:origin-to-gl:
  stage: test
  interruptible: true
  timeout: 30m
  rules:
    # Disabled temporarily (re-enable schedule/web llvm-sync workflow in root .gitlab-ci.yml too).
    - when: never
  tags:
    - kotlin
    - linux
    - x64
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"
    LLVM_SYNC_BRANCH: "kmp-llvm-19.1.4"
  script:
    - bash scripts/ci/llvm-sync-origin-to-gl.sh

# Linux Docker image (pin matches infra/docker/Dockerfile). Prefer local cache: avoid runner default
# pull_policy=always (re-pull every job). If a runner rejects non-default policies, set
# [runners.docker] pull_policy = ["if-not-present"] on llvm-linux-x64 or allow the job keyword.
# Runner config.toml must bind-mount ~/gitlab-runner/cache into the container (ccache, sysroot).
# Only set to docker execution legs.
.llvm-linux-builder-image:
  image:
    name: ghcr.io/linhandev/kn-action-linux-llvm-builder:bc3de27
    pull_policy: if-not-present

# Linux Docker is its own job (image, FF_*) — do not mix with macOS shell legs in one matrix.
# FF_NETWORK_PER_BUILD=true isolates each job on a bridge that often cannot reach LAN GitCode / artifact hosts.
build:llvm:linux:x64:
  extends:
    - .llvm-build-matrix-common
    - .llvm-compile-job-rules
    - .llvm-linux-builder-image
  needs: []
  tags:
    - llvm
    - linux
    - x64
  variables:
    FF_NETWORK_PER_BUILD: "false"
  artifacts:
    when: always
    paths:
      - .llvm-ci-meta/
    expire_in: 2 days
  script:
    - bash scripts/ci/llvm-build.sh linux

# macOS shell legs: two explicit jobs (studio arm64, mini x64), no Docker `image` (see .llvm-linux-builder-image).
# Three build jobs total: linux + mac arm64 + mac x64 (same matrix shape as GHA build-llvm.yml).
.llvm-build-macos-common:
  extends:
    - .llvm-build-matrix-common
    - .llvm-compile-job-rules
  needs: []
  artifacts:
    when: always
    paths:
      - .llvm-ci-meta/
    expire_in: 2 days

build:llvm:macos:arm64:
  extends: .llvm-build-macos-common
  tags:
    - llvm
    - macos
    - arm64
  script:
    - bash scripts/ci/llvm-build.sh macos-arm64

build:llvm:macos:x64:
  extends:
    - .llvm-build-macos-common
  tags:
    - llvm
    - macos
    - x64
  script:
    - bash scripts/ci/llvm-build.sh macos-x64

# --- merge outer tars (GHA llvm-artifact-refs + cross-copy) ---
#
# Design: llvm:cross-copy is pinned to macOS arm64 (llvm-macos-arm64 / studio) on purpose.
# The LAN artifact server is operated from that host class, so downloads/uploads avoid long
# cross-machine paths and Docker bridge issues. The step only merges outer tars, runs
# platform_package.sh (file I/O + archives), and re-uploads; it does not execute the built LLVM
# toolchain on the runner—host choice is for artifact locality and tooling, not for running OH
# binaries on the merge host.

llvm:artifact-refs:
  extends:
    - .llvm-build-rules
    # Same image as build:llvm:linux:x64 (bash + curl); avoids apk on Alpine when the
    # llvm-linux-x64 registration is shell-only or image is ignored.
    - .llvm-linux-builder-image
  stage: llvm_merge
  tags:
    - llvm
    - linux
    - x64
  variables:
    # Match build:llvm:linux:x64 so the container can reach the LAN artifact host (not an isolated bridge).
    FF_NETWORK_PER_BUILD: "false"
  needs:
    - job: build:llvm:linux:x64
      artifacts: true
      optional: true
    - job: build:llvm:macos:arm64
      artifacts: true
      optional: true
    - job: build:llvm:macos:x64
      artifacts: true
      optional: true
  script:
    - bash scripts/ci/llvm-artifact-refs.sh
  artifacts:
    reports:
      dotenv: llvm-artifact-refs.env

# See design note above: macOS arm64 only (artifact server + merge workload; no LLVM execution here).
llvm:cross-copy:
  extends: .llvm-build-rules
  stage: llvm_merge
  tags:
    - llvm
    - macos
    - arm64
  needs:
    - job: llvm:artifact-refs
      artifacts: true
  timeout: 2h
  variables:
    LLVM_ESSENTIALS_ID: "203"
    LLVM_MAJOR_FOR_PACKAGE: "19"
    CLANG_RESOURCE_VERSION: "19"
  script:
    - bash scripts/ci/llvm-cross-copy.sh
  artifacts:
    reports:
      dotenv: cross-copy.env

# --- OHOS compile smoke per host (GHA ohos-test-build) ---

.ohos-build-test-common:
  extends: .llvm-build-rules
  stage: llvm_verify
  interruptible: true
  timeout: 45m
  needs:
    - job: llvm:cross-copy
      artifacts: true
  variables:
    OHOS_SYSROOT: sysroot-ohos-aarch64-6.0.2.640-02
    OHOS_SYSROOT_URL: https://maven.eazytec-cloud.com/nexus/repository/file-storage/sysroot-ohos-aarch64-6.0.2.640-02.tar.gz
    OHOS_SYSROOT_CACHE_DIR: ~/gitlab-runner/cache

ohos:build-test:linux-x64:
  extends:
    - .ohos-build-test-common
    - .llvm-linux-builder-image
  tags:
    - llvm
    - linux
    - x64
  script:
    - bash scripts/ci/ohos-test-build.sh linux-x64

ohos:build-test:windows-x64:
  extends: .ohos-build-test-common
  tags:
    - llvm
    - windows
    - x64
  # Windows Git Bash PATH quirks (find.exe vs GNU find) and OHOS clang paths are still being
  # validated on llvm-windows-x64; do not block merge pipelines on this leg.
  allow_failure: true
  variables:
    RUNNER_OS: Windows
  script:
    - bash scripts/ci/ohos-test-build.sh windows-x64

ohos:build-test:macos-arm64:
  extends: .ohos-build-test-common
  tags:
    - llvm
    - macos
    - arm64
  script:
    - bash scripts/ci/ohos-test-build.sh macos-arm64

ohos:build-test:macos-x64:
  extends: .ohos-build-test-common
  tags:
    - llvm
    - macos
    - x64
  script:
    - bash scripts/ci/ohos-test-build.sh macos-x64

# --- execute downloaded test artifacts on macOS arm64 (GHA hdc-ohos-verify parity) ---

ohos:execute:macos-arm64:
  extends: .llvm-build-rules
  stage: llvm_verify
  tags:
    - llvm
    - macos
    - arm64
  needs:
    - job: ohos:build-test:linux-x64
    - job: ohos:build-test:windows-x64
    - job: ohos:build-test:macos-arm64
    - job: ohos:build-test:macos-x64
  # scripts/ci/hdc-verify-all.sh downloads all host test artifacts and executes each pair.
  allow_failure: true
  script:
    - bash scripts/ci/hdc-verify-all.sh
