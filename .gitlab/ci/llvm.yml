# Ported from .github/workflows/build-llvm.yml (build → llvm-artifact-refs → cross-copy → ohos-test → hdc).
#
# Web + MR + scheduled clean for LLVM (no branch push pipeline; see root .gitlab-ci.yml workflow).
# Web: set TARGET=llvm for LLVM-only (no prepare-repo matrix).
# Schedule: set TARGET=llvm and LLVM_DAILY_CLEAN_SCHEDULE=true on the pipeline schedule; optional cron example in root .gitlab-ci.yml.
#
# By default build:llvm:* runs (SKIP_LLVM_BUILD=false). Set SKIP_LLVM_BUILD=true to skip compile;
# downstream merge/verify jobs fall back to the latest outer tars from the LAN artifact server
# (scripts/ci/llvm-artifact-refs.sh).

.llvm-build-matrix-common:
  stage: build # TODO: change to build-llvm
  # true so workflow:auto_cancel:on_new_commit:interruptible can stop in-flight builds when the MR gets a new commit.
  interruptible: true
  timeout: 6h
  # Same as scripts/ci/llvm-build.sh default and GHA build-llvm.yml: repo init --reference when present.
  # Use before_script so $HOME expands (GitLab variables: do not expand $HOME reliably).
  before_script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ] && [ "${LLVM_DAILY_CLEAN_SCHEDULE:-}" = "true" ]; then
        export LLVM_CLEAN_BUILD=true
      fi
    - export LOCAL_REFERENCE_DIR="${HOME}/git/ci/llvm-project-kmp"
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"
    # Exclude llvm/ (repo sync tree, prebuilts, build output) and bin/ (repo tool) from git clean
    # so incremental builds reuse the workspace. -e excludes matching paths from removal.
    GIT_CLEAN_FLAGS: "-ffd -e llvm/ -e bin/"

.llvm-build-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $LLVM_DAILY_CLEAN_SCHEDULE == "true" && $TARGET == "llvm"'
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $TARGET == "llvm"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .github/workflows/build-llvm.yml
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
        - scripts/ci/llvm-build.sh
        - scripts/ci/llvm-artifact-refs.sh
        - scripts/ci/llvm-cross-copy.sh
        - scripts/ci/ohos-test-build.sh
        - scripts/ci/hdc-verify-all.sh
        - scripts/setup-repo-tool.sh
        - scripts/platform_package.sh

# Same triggers as .llvm-build-rules but compile jobs are skipped when SKIP_LLVM_BUILD=true.
# Only build:llvm:* jobs use this rule. Downstream merge/verify jobs use .llvm-build-rules and fall
# back to the LAN artifact server when builds are skipped.
.llvm-compile-job-rules:
  rules:
    - if: '$SKIP_LLVM_BUILD == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $LLVM_DAILY_CLEAN_SCHEDULE == "true" && $TARGET == "llvm"'
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $TARGET == "llvm"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .github/workflows/build-llvm.yml
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
        - scripts/ci/llvm-build.sh
        - scripts/ci/llvm-artifact-refs.sh
        - scripts/ci/llvm-cross-copy.sh
        - scripts/ci/ohos-test-build.sh
        - scripts/ci/hdc-verify-all.sh
        - scripts/setup-repo-tool.sh
        - scripts/platform_package.sh

sync:llvm:origin-to-gl:
  stage: test
  interruptible: true
  timeout: 30m
  rules:
    # Disabled temporarily (re-enable schedule/web llvm-sync workflow in root .gitlab-ci.yml too).
    - when: never
  tags:
    - kotlin
    - linux
    - x64
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"
    LLVM_SYNC_BRANCH: "kmp-llvm-19.1.4"
  script:
    - bash scripts/ci/llvm-sync-origin-to-gl.sh

# Linux Docker image (pin matches infra/docker/Dockerfile). Prefer local cache: avoid runner default
# pull_policy=always (re-pull every job). If a runner rejects non-default policies, set
# [runners.docker] pull_policy = ["if-not-present"] on llvm-linux-x64 or allow the job keyword.
# Runner config.toml must bind-mount ~/gitlab-runner/cache into the container (ccache, sysroot).
# Only set to docker execution legs.
.llvm-linux-builder-image:
  image:
    name: ghcr.io/linhandev/kn-action-linux-llvm-builder:bc3de27
    pull_policy: if-not-present

# Linux Docker is its own job (image, FF_*) — do not mix with macOS shell legs in one matrix.
# FF_NETWORK_PER_BUILD=true isolates each job on a bridge that often cannot reach LAN GitCode.
build:llvm:linux:x64:
  extends:
    - .llvm-build-matrix-common
    - .llvm-compile-job-rules
    - .llvm-linux-builder-image
  needs: []
  tags:
    - llvm
    - linux
    - x64
  variables:
    FF_NETWORK_PER_BUILD: "false"
  script:
    - bash scripts/ci/llvm-build.sh linux

# macOS shell legs: two explicit jobs (studio arm64, mini x64), no Docker `image` (see .llvm-linux-builder-image).
# Three build jobs total: linux + mac arm64 + mac x64 (same matrix shape as GHA build-llvm.yml).
# All build outputs uploaded to LAN artifact server (llvm-build.sh), no GitLab artifacts needed.
.llvm-build-macos-common:
  extends:
    - .llvm-build-matrix-common
    - .llvm-compile-job-rules
  needs: []

build:llvm:macos:arm64:
  extends: .llvm-build-macos-common
  tags:
    - llvm
    - macos
    - arm64
  script:
    - bash scripts/ci/llvm-build.sh macos-arm64

build:llvm:macos:x64:
  extends:
    - .llvm-build-macos-common
  tags:
    - llvm
    - macos
    - x64
  script:
    - bash scripts/ci/llvm-build.sh macos-x64

# --- merge outer tars (llvm-artifact-refs + cross-copy) ---
#
# artifact-refs and cross-copy run on chore runners (lightweight, concurrent=2).
# Build jobs stay on llvm runners (heavyweight, concurrent=1).

llvm:artifact-refs:
  extends: .llvm-build-rules
  stage: llvm_merge
  tags:
    - chore
    - linux
    - x64
  needs:
    - job: build:llvm:linux:x64
      optional: true
    - job: build:llvm:macos:arm64
      optional: true
    - job: build:llvm:macos:x64
      optional: true
  script:
    - bash scripts/ci/llvm-artifact-refs.sh
  artifacts:
    reports:
      dotenv: llvm-artifact-refs.env
    expire_in: 2 days

# Cross-copy merges outer tars and runs platform_package.sh; it does not execute the built LLVM
# toolchain. Pinned to macOS arm64 (studio) for native tar handling of macOS extended attributes.
llvm:cross-copy:
  extends: .llvm-build-rules
  stage: llvm_merge
  tags:
    - chore
    - macos
    - arm64
  needs:
    - job: llvm:artifact-refs
      artifacts: true
  timeout: 2h
  script:
    - bash scripts/ci/llvm-cross-copy.sh
  artifacts:
    reports:
      dotenv: cross-copy.env
    expire_in: 1 week

# --- OHOS compile smoke per host (GHA ohos-test-build) ---

.ohos-build-test-common:
  extends: .llvm-build-rules
  stage: llvm_verify
  interruptible: true
  timeout: 45m
  needs:
    - job: llvm:cross-copy
      artifacts: true
  variables:
    OHOS_SYSROOT: sysroot-ohos-aarch64-6.0.2.640-02
    OHOS_SYSROOT_URL: https://maven.eazytec-cloud.com/nexus/repository/file-storage/sysroot-ohos-aarch64-6.0.2.640-02.tar.gz
    OHOS_SYSROOT_CACHE_DIR: ~/gitlab-runner/cache
  artifacts:
    when: always
    paths:
      - .ohos-test-binaries/
    reports:
      junit: .junit/ohos-test-build-*.xml
    expire_in: 2 days

ohos:build-test:linux-x64:
  extends: .ohos-build-test-common
  tags:
    - chore
    - linux
    - x64
  script:
    - bash scripts/ci/ohos-test-build.sh linux-x64

ohos:build-test:windows-x64:
  extends: .ohos-build-test-common
  tags:
    - chore
    - windows
    - x64
  variables:
    RUNNER_OS: Windows
    GIT_CONFIG_NOSYSTEM: "1"
    GIT_STRATEGY: clone
  script:
    - bash scripts/ci/ohos-test-build.sh windows-x64

ohos:build-test:macos-arm64:
  extends: .ohos-build-test-common
  tags:
    - chore
    - macos
    - arm64
  script:
    - bash scripts/ci/ohos-test-build.sh macos-arm64

ohos:build-test:macos-x64:
  extends: .ohos-build-test-common
  tags:
    - chore
    - macos
    - x64
  script:
    - bash scripts/ci/ohos-test-build.sh macos-x64

# --- execute downloaded test artifacts on macOS arm64 (GHA hdc-ohos-verify parity) ---

ohos:execute:macos-arm64:
  extends: .llvm-build-rules
  stage: llvm_verify
  tags:
    - chore
    - macos
    - arm64
  needs:
    - job: ohos:build-test:linux-x64
      artifacts: true
    - job: ohos:build-test:windows-x64
      artifacts: true
    - job: ohos:build-test:macos-arm64
      artifacts: true
    - job: ohos:build-test:macos-x64
      artifacts: true
  artifacts:
    when: always
    reports:
      junit: .junit/hdc-verify.xml
    expire_in: 2 days
  script:
    - bash scripts/ci/hdc-verify-all.sh
