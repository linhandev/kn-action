# LLVM pipeline: build → cross-copy (if builds ran) → provide-artifacts → test
#
# Web + MR + scheduled clean for LLVM (no branch push pipeline; see root .gitlab-ci.yml workflow).
# Build jobs check artifact server for cached final artifacts; skip compile if found.
# Cross-copy runs only when at least one build job compiled (not skipped).
# provide-artifacts aggregates final artifact names for downstream test jobs.

.llvm-build-matrix-common:
  stage: llvm_build
  interruptible: true
  timeout: 6h
  before_script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ] && [ "${LLVM_DAILY_CLEAN_SCHEDULE:-}" = "true" ]; then
        export LLVM_CLEAN_BUILD=true
      fi
    - export LOCAL_REFERENCE_DIR="${HOME}/git/ci/llvm-project-kmp"
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"
    GIT_CLEAN_FLAGS: "-ffd -e llvm/ -e bin/"

.llvm-build-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $LLVM_DAILY_CLEAN_SCHEDULE == "true" && $TARGET == "llvm"'
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $TARGET == "llvm"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .github/workflows/build-llvm.yml
        - .gitlab-ci.yml
        - .gitlab/ci/llvm.yml
        - .gitlab/ci/prepare-repo.yml
        - scripts/ci/llvm-build.sh
        - scripts/ci/llvm-cross-copy.sh
        - scripts/ci/llvm-provide-artifacts.sh
        - scripts/ci/ohos-test-build.sh
        - scripts/ci/hdc-verify-all.sh
        - scripts/setup-repo-tool.sh
        - scripts/platform_package.sh

sync:llvm:origin-to-gl:
  stage: llvm_build
  interruptible: true
  timeout: 30m
  rules:
    - when: never
  tags:
    - kotlin
    - linux
    - x64
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"
    LLVM_SYNC_BRANCH: "kmp-llvm-19.1.4"
  script:
    - bash scripts/ci/llvm-sync-origin-to-gl.sh

.llvm-linux-builder-image:
  image:
    name: ghcr.io/linhandev/kn-action-linux-llvm-builder:bc3de27
    pull_policy: if-not-present

build:llvm:linux:x64:
  extends:
    - .llvm-build-matrix-common
    - .llvm-build-rules
    - .llvm-linux-builder-image
  needs: []
  tags:
    - llvm
    - linux
    - x64
  variables:
    FF_NETWORK_PER_BUILD: "false"
  script:
    - bash scripts/ci/llvm-build.sh linux
  artifacts:
    paths:
      - llvm-build-linux.env
    reports:
      dotenv: llvm-build-linux.env
    expire_in: 2 days

.llvm-build-macos-common:
  extends:
    - .llvm-build-matrix-common
    - .llvm-build-rules
  needs: []

build:llvm:macos:arm64:
  extends: .llvm-build-macos-common
  tags:
    - llvm
    - macos
    - arm64
  script:
    - bash scripts/ci/llvm-build.sh macos-arm64
  artifacts:
    paths:
      - llvm-build-macos-arm64.env
    reports:
      dotenv: llvm-build-macos-arm64.env
    expire_in: 2 days

build:llvm:macos:x64:
  extends: .llvm-build-macos-common
  tags:
    - llvm
    - macos
    - x64
  script:
    - bash scripts/ci/llvm-build.sh macos-x64
  artifacts:
    paths:
      - llvm-build-macos-x64.env
    reports:
      dotenv: llvm-build-macos-x64.env
    expire_in: 2 days

llvm:cross-copy:
  extends: .llvm-build-rules
  stage: llvm_artifact
  tags:
    - chore
    - macos
    - arm64
  needs:
    - job: build:llvm:linux:x64
      optional: true
      artifacts: true
    - job: build:llvm:macos:arm64
      optional: true
      artifacts: true
    - job: build:llvm:macos:x64
      optional: true
      artifacts: true
  rules:
    - if: '$SKIP_BUILD_ALL == "true"'
      when: never
    - when: on_success
  timeout: 2h
  script:
    - bash scripts/ci/llvm-cross-copy.sh
  artifacts:
    paths:
      - cross-copy.env
    reports:
      dotenv: cross-copy.env
    expire_in: 2 days

llvm:provide-artifacts:
  extends: .llvm-build-rules
  stage: llvm_artifact
  tags:
    - chore
    - linux
    - x64
  needs:
    - job: build:llvm:linux:x64
      optional: true
      artifacts: true
    - job: build:llvm:macos:arm64
      optional: true
      artifacts: true
    - job: build:llvm:macos:x64
      optional: true
      artifacts: true
    - job: llvm:cross-copy
      optional: true
      artifacts: true
  script:
    - bash scripts/ci/llvm-provide-artifacts.sh
  artifacts:
    paths:
      - llvm-artifacts.env
    reports:
      dotenv: llvm-artifacts.env
    expire_in: 2 days

.ohos-build-test-common:
  extends: .llvm-build-rules
  stage: llvm_verify
  interruptible: true
  timeout: 45m
  needs:
    - job: llvm:provide-artifacts
      artifacts: true
  variables:
    OHOS_SYSROOT: sysroot-ohos-aarch64-6.0.2.640-02
    OHOS_SYSROOT_URL: https://maven.eazytec-cloud.com/nexus/repository/file-storage/sysroot-ohos-aarch64-6.0.2.640-02.tar.gz
    OHOS_SYSROOT_CACHE_DIR: ~/gitlab-runner/cache
  artifacts:
    when: always
    paths:
      - .ohos-test-binaries/
    reports:
      junit: .junit/ohos-test-build-*.xml
    expire_in: 2 days

ohos:build-test:linux-x64:
  extends: .ohos-build-test-common
  tags:
    - chore
    - linux
    - x64
  script:
    - bash scripts/ci/ohos-test-build.sh linux-x64

ohos:build-test:windows-x64:
  extends: .ohos-build-test-common
  tags:
    - chore
    - windows
    - x64
  variables:
    RUNNER_OS: Windows
    GIT_CONFIG_NOSYSTEM: "1"
    GIT_STRATEGY: clone
  script:
    - bash scripts/ci/ohos-test-build.sh windows-x64

ohos:build-test:macos-arm64:
  extends: .ohos-build-test-common
  tags:
    - chore
    - macos
    - arm64
  script:
    - bash scripts/ci/ohos-test-build.sh macos-arm64

ohos:build-test:macos-x64:
  extends: .ohos-build-test-common
  tags:
    - chore
    - macos
    - x64
  script:
    - bash scripts/ci/ohos-test-build.sh macos-x64

# --- execute downloaded test artifacts on macOS arm64 (GHA hdc-ohos-verify parity) ---

ohos:execute:macos-arm64:
  extends: .llvm-build-rules
  stage: llvm_verify
  tags:
    - chore
    - macos
    - arm64
  needs:
    - job: ohos:build-test:linux-x64
      artifacts: true
    - job: ohos:build-test:windows-x64
      artifacts: true
    - job: ohos:build-test:macos-arm64
      artifacts: true
    - job: ohos:build-test:macos-x64
      artifacts: true
  artifacts:
    when: always
    reports:
      junit: .junit/hdc-verify.xml
    expire_in: 2 days
  script:
    - bash scripts/ci/hdc-verify-all.sh
