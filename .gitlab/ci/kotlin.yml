# Kotlin OH build — port of .github/workflows/build-kotlin.yml (GitLab matrix).
# Web/API: TARGET=kotlin → Kotlin only (no LLVM jobs). TARGET=llvm → LLVM stages then Kotlin build & HAP test.
# MR: Kotlin path changes → Kotlin only. LLVM path changes → LLVM only (use manual TARGET=llvm for Kotlin after LLVM).
# Runners: kotlin + OS + arch (AGENTS.md). Requires GITCODE_SSH_PRIVATE_KEY for kotlin clone.
#
# When llvm:provide-artifacts is in the pipeline (TARGET=llvm), kotlin jobs wait on it via needs (optional).

.kotlin-build-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $TARGET == "llvm"'
      when: never
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $TARGET == "kotlin"'
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $TARGET == "llvm"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/kotlin.yml
        - .github/workflows/build-kotlin.yml
        - scripts/ci/kotlin-build.sh
        - scripts/ci/kotlin-hap-smoke-test.sh
        - scripts/proxy.init.gradle
        - scripts/rewrite-gradle-wrapper-reposlite.sh
        - patches/**/*
        - .github/actions/prepare-repo/**/*
        - .github/actions/upload-artifact-local/**/*
        - .github/actions/download-artifact-local/**/*

.kotlin-build-common:
  stage: kotlin_build
  interruptible: true
  timeout: 6h
  extends: .kotlin-build-rules
  needs:
    # Present only when TARGET=llvm (or MR touches LLVM); then Kotlin waits for llvm-artifacts.env.
    - job: llvm:provide-artifacts
      optional: true
      artifacts: true
    - job: ohos:execute:macos-arm64
      optional: true
      artifacts: false
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"
    GIT_CLEAN_FLAGS: "-ffd"
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -t ed25519,ecdsa,rsa gitcode.com >> ~/.ssh/known_hosts 2>/dev/null || true
    - |
      if [ -n "${GITCODE_SSH_PRIVATE_KEY:-}" ]; then
        printf '%s\n' "$GITCODE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/id_ed25519
      fi

build:kotlin:linux:x64:
  extends: .kotlin-build-common
  tags:
    - kotlin
    - linux
    - x64
  script:
    - bash scripts/ci/kotlin-build.sh linux-x64

build:kotlin:macos:arm64:
  extends: .kotlin-build-common
  tags:
    - kotlin
    - macos
    - arm64
  artifacts:
    reports:
      dotenv: ci-workspace/kotlin-version.env
  script:
    - bash scripts/ci/kotlin-build.sh macos-arm64

# Smoke-test the freshly-built Kotlin/Native compiler by compiling kn_samples bare branch
# into a HarmonyOS HAP and running it on a connected device.
test:kotlin:hap:macos-arm64:
  stage: kotlin_verify
  interruptible: true
  timeout: 30m
  extends: .kotlin-build-rules
  needs:
    - job: build:kotlin:macos:arm64
      artifacts: true
  tags:
    - chore
    - macos
    - arm64
  variables:
    PATH: "/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/toolchains:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  artifacts:
    when: always
    paths:
      - kn-samples-work/kn_samples/harmonyApp/**/outputs/**/*.hap
    expire_in: 7 days
  script:
    - bash scripts/ci/kotlin-hap-smoke-test.sh

