build:kotlin:macos:arm64:
  extends: .kotlin-build-common
  needs: []
  tags:
    - kotlin
    - macos
    - arm64
  artifacts:
    when: always
    paths:
      - ci-workspace/kotlin-native/kotlin-native-macos-aarch64-*.tar.gz
    expire_in: 2 days
  script:
    - bash scripts/ci/kotlin-build.sh macos-arm64

# Smoke-test the freshly-built Kotlin/Native compiler by compiling kn_samples bare branch
# into a HarmonyOS HAP and running it on a connected device.
test:kotlin:hap:macos-arm64:
  stage: kotlin_verify
  interruptible: true
  timeout: 30m
  extends: .kotlin-build-rules
  needs:
    - job: build:kotlin:macos:arm64
      artifacts: true
  tags:
    - chore
    - macos
    - arm64
  variables:
    PATH: "/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/toolchains:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  script:
    - bash scripts/ci/kotlin-hap-smoke-test.sh

