# Kotlin OH build — GitLab matrix (Linux uses Docker image below; macOS/Windows use runner JDKs).
# Web/API: TARGET=kotlin → Kotlin only (no LLVM jobs). TARGET=llvm → LLVM stages then Kotlin build & HAP test.
# LLVM jobs are excluded when LLVM_SKIP_PIPELINE=true (see .gitlab/ci/llvm.yml).
# Use fresh OH LLVM for Konan: pipeline input kotlin_use_fresh_llvm → KOTLIN_USE_FRESH_LLVM (root .gitlab-ci.yml).
# MR: changes under CI roots (.gitlab, .github, scripts, manifest, patches) or root .gitlab-ci.yml → Kotlin (LLVM pipeline may run too).
# Runners: kotlin + OS + arch (AGENTS.md). GitCode SSH: scripts/ci/kotlin-build.sh (GITCODE_SSH_PRIVATE_KEY or ~/.ssh).
# Linux Kotlin (build:kotlin:linux:x64): ghcr.io/<owner>/kn-action-kotlin-linux-builder:<short-sha> — pin matches GHA build-kotlin-linux-image.yml tags (short git SHA); bump when Dockerfile changes and image is rebuilt.
#
# llvm:provide-artifacts is optional on needs when LLVM stages are omitted.

.kotlin-build-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $TARGET == "llvm"'
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $TARGET == "kotlin"'
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $TARGET == "llvm"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml
        - .gitlab/**/*
        - scripts/**/*
        - manifest/**/*
        - patches/**/*

.kotlin-build-common:
  stage: kotlin_build
  interruptible: true
  timeout: 6h
  extends: .kotlin-build-rules
  needs:
    - job: llvm:provide-artifacts
      optional: true
      artifacts: true
    - job: ohos:execute:macos-arm64
      optional: true
      artifacts: false
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"
    GIT_CLEAN_FLAGS: "-ffd"

.kotlin-linux-builder-image:
  image:
    name: ghcr.io/linhandev/kn-action-kotlin-linux-builder:3a0eb36
    pull_policy: if-not-present

build:kotlin:linux:x64:
  extends:
    - .kotlin-build-common
    - .kotlin-linux-builder-image
  tags:
    - kotlin
    - linux
    - x64
  variables:
    FF_NETWORK_PER_BUILD: "false"
  artifacts:
    reports:
      dotenv: ci-workspace/kotlin-version.env
  script:
    - bash scripts/ci/kotlin-build.sh linux-x64

build:kotlin:macos:arm64:
  extends: .kotlin-build-common
  tags:
    - kotlin
    - macos
    - arm64
  artifacts:
    reports:
      dotenv: ci-workspace/kotlin-version.env
  script:
    - bash scripts/ci/kotlin-build.sh macos-arm64

build:kotlin:macos:x64:
  extends: .kotlin-build-common
  tags:
    - kotlin
    - macos
    - x64
  artifacts:
    reports:
      dotenv: ci-workspace/kotlin-version.env
  script:
    - bash scripts/ci/kotlin-build.sh macos-x64

build:kotlin:windows:x64:
  extends:
    - .kotlin-build-common
    - .windows-gitbash-pre-sources
  tags:
    - kotlin
    - windows
    - x64
  artifacts:
    reports:
      dotenv: ci-workspace/kotlin-version.env
  script:
    - bash scripts/ci/kotlin-build.sh windows-x64

# Smoke-test: build kn_samples HAP with Kotlin from published build/repo and run on device (hdc).
# Chore runners: macOS (arm64 or x64) with DevEco under /Applications; Windows x64 — set DEVECO_SDK_HOME, NODE_HOME, PATH (hdc) on runner or CI.
.kotlin-hap-smoke-common:
  stage: kotlin_verify
  interruptible: true
  timeout: 30m
  extends: .kotlin-build-rules
  artifacts:
    when: always
    paths:
      - kn-samples-work/kn_samples/harmonyApp/**/outputs/**/*.hap
    expire_in: 7 days
  script:
    - bash scripts/ci/kotlin-hap-smoke-test.sh

test:kotlin:hap:macos-arm64:
  extends: .kotlin-hap-smoke-common
  tags:
    - chore
    - macos
    - arm64
  variables:
    PATH: "/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/toolchains:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  needs:
    - job: build:kotlin:macos:arm64
      artifacts: true

test:kotlin:hap:after-linux-build:
  extends: .kotlin-hap-smoke-common
  tags:
    - chore
    - macos
    - arm64
  variables:
    PATH: "/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/toolchains:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  needs:
    - job: build:kotlin:linux:x64
      artifacts: true

test:kotlin:hap:after-macos-x64-build:
  extends: .kotlin-hap-smoke-common
  tags:
    - chore
    - macos
    - x64
  variables:
    PATH: "/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/toolchains:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
    KOTLIN_HAP_ARTIFACT_GLOB: "kotlin-*_macOS_X64.tar.gz"
    KN_HAP_NATIVE_TARBALL_GLOB: "kotlin-native-macos_x64-*.tar.gz"
  needs:
    - job: build:kotlin:macos:x64
      artifacts: true

test:kotlin:hap:after-windows-build:
  extends:
    - .kotlin-hap-smoke-common
    - .windows-gitbash-pre-sources
  tags:
    - chore
    - windows
    - x64
  variables:
    KOTLIN_HAP_ARTIFACT_GLOB: "kotlin-*_Windows_X64.tar.gz"
    KN_HAP_NATIVE_TARBALL_GLOB: "kotlin-native-mingw_x64-*.tar.gz"
  needs:
    - job: build:kotlin:windows:x64
      artifacts: true
