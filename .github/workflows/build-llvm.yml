# Build LLVM toolchain for OpenHarmony using repo-managed multi-repo checkout.
# macOS: runs on host. Linux: runs inside OpenHarmony build env Docker image.
# Incremental by default: workspace persists next to action checkout. Clean build wipes it first.
# Requires: environment "env" with secret GITCODE_TOKEN (GitCode PAT with read access) for repo sync from gitcode.com.

name: Build LLVM

run-name: ${{ github.event.inputs.run_name || 'Build LLVM' }}

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Wipe workspace and build from scratch'
        default: false
        type: boolean
      skip_build:
        description: 'Skip build job, start from cross-copy. Uses latest artifacts from previous runs'
        default: false
        type: boolean
      run_name:
        description: 'Custom title for this run (shown in Actions UI)'
        required: false
        type: string
  # push:
  #   paths:
  #     - '.github/workflows/build-llvm.yml'

env:
  MANIFEST_URL: https://gitcode.com/linhandev/manifest.git
  MANIFEST_FILE: llvm-toolchain.xml
  LOCAL_REFERENCE_DIR: ~/git/ci/llvm-project-kmp
  LLVM_WORKSPACE: ${{ github.workspace }}/llvm
  REPO_DIR: ${{ github.workspace }}/bin
  ARTIFACT_LOCAL_PATH: ~/runner/artifact
  OHOS_SYSROOT: sysroot-ohos-aarch64-6.0.2.640-02

jobs:
  build:
    name: build (${{ matrix.runner[1] }}-${{ matrix.runner[2] }})
    if: github.event.inputs.skip_build != 'true'
    environment: env
    outputs:
      llvm_sha_short: ${{ steps.archive.outputs.llvm_sha_short }}
      action_sha_short: ${{ steps.archive.outputs.action_sha_short }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, macOS, ARM64, llvm]
            container_image: ''
          - runner: [self-hosted, macOS, X64, llvm]
            container_image: ''
          - runner: [self-hosted, linux, X64, llvm]
            container_image: ghcr.io/${{ github.repository_owner }}/kn-action-linux-llvm-builder:latest
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container_image }}
      volumes:
        - ${{ github.workspace }}/../../../artifact:/home/runner/runner/artifact
    steps:
      - name: Checkout kn-action
        uses: actions/checkout@v6
        with:
          path: kn-action

      - name: Setup environment
        id: vars
        shell: bash
        run: |
          echo $(realpath ${{ env.ARTIFACT_LOCAL_PATH }})
          CLEAN_BUILD="${{ github.event.inputs.clean_build || 'false' }}"

          if [ "$CLEAN_BUILD" = "true" ]; then
            rm -rf "$LLVM_WORKSPACE"
          fi
          mkdir -p "$LLVM_WORKSPACE"

          NEED_ENV_PREPARE="false"
          if [ ! -d "$LLVM_WORKSPACE/prebuilts/cmake" ]; then
            NEED_ENV_PREPARE="true"
          fi

          {
            echo "LLVM_WORKSPACE=$LLVM_WORKSPACE"
            echo "clean_build=$CLEAN_BUILD"
            echo "need_env_prepare=$NEED_ENV_PREPARE"
            echo "repo_dir=$REPO_DIR"
          } | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ENV_HINTS: 1
          CI: 1
        run: |
          brew_install_quiet() {
            local out
            out=$(brew install "$@" 2>&1)
            local ret=$?
            echo "$out" | grep -v 'Warning:.*already installed and up-to-date' | grep -v 'To reinstall' | grep -v '  brew reinstall' || true
            return $ret
          }
          brew_install_quiet swig git-lfs java coreutils wget
          brew_install_quiet pigz python

      - name: Setup git
        shell: bash
        env:
          LLVM_WORKSPACE: ${{ steps.vars.outputs.LLVM_WORKSPACE }}
        run: |
          git config --global --add safe.directory "$LLVM_WORKSPACE/build"
          git config --global --add safe.directory "$LLVM_WORKSPACE/third_party/musl"
          git config --global user.email &>/dev/null || git config --global user.email "ci@ci.ci"
          git config --global user.name &>/dev/null || git config --global user.name "ci"

      - name: Setup git credentials for GitCode
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if [ -z "${GITCODE_TOKEN}" ]; then
            echo "::error::GITCODE_TOKEN secret is not set. Add it in repo Settings → Secrets and variables → Actions (GitCode token with read access)."
            exit 1
          fi
          git config --global credential.helper ''
          git config --global --unset-all url."https://linhandev:${GITCODE_TOKEN}@gitcode.com/".insteadOf 2>/dev/null || true
          git config --global url."https://linhandev:${GITCODE_TOKEN}@gitcode.com/".insteadOf "https://gitcode.com/"
          git config --global --add url."https://linhandev:${GITCODE_TOKEN}@gitcode.com/".insteadOf "git@gitcode.com:"

      - name: Setup repo tool
        shell: bash
        run: |
          REPO_DIR="$GITHUB_WORKSPACE/bin"
          REPO_BIN="$REPO_DIR/repo"
          mkdir -p "$REPO_DIR"
          if [ ! -x "$REPO_BIN" ]; then
            curl -fSL -o "$REPO_BIN" "https://gitee.com/oschina/repo/raw/fork_flow/repo-py3"
            head -c 2 "$REPO_BIN" | grep -q '#!' || { echo "::error::Downloaded repo script invalid (no shebang)"; exit 1; }
            chmod a+x "$REPO_BIN"
            python -m pip install requests || pip3 install requests || pip install requests
          fi
          echo "$REPO_DIR" >> "$GITHUB_PATH"
          export PATH="$REPO_DIR:$PATH"
          repo --version

      - name: Init repo manifest
        shell: bash
        env:
          LLVM_WORKSPACE: ${{ steps.vars.outputs.LLVM_WORKSPACE }}
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          # Init when .repo is missing (first run) or when doing a clean build
          if [ ! -d "$LLVM_WORKSPACE/.repo" ] || [ "${{ steps.vars.outputs.clean_build }}" = "true" ]; then
            cd "$LLVM_WORKSPACE"
            REFERENCE_FLAG=""
            if [ -d "${{ env.LOCAL_REFERENCE_DIR }}" ]; then
              REFERENCE_FLAG="--reference=${{ env.LOCAL_REFERENCE_DIR }}"
            fi
            repo init -u "${{ env.MANIFEST_URL }}" -m "${{ env.MANIFEST_FILE }}" $REFERENCE_FLAG
          fi

      - name: Sync source
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          cd "${{ steps.vars.outputs.LLVM_WORKSPACE }}"
          repo sync -c -v -j 16
          repo forall -c 'git lfs pull'

      - name: Prepare build environment
        if: steps.vars.outputs.need_env_prepare == 'true'
        shell: bash
        run: |
          cd "${{ steps.vars.outputs.LLVM_WORKSPACE }}"
          bash -x toolchain/llvm-project/llvm-build/env_prepare.sh

      - name: Build LLVM
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export CCACHE_DIR="${{ github.workspace }}/.ccache"
            export CCACHE_MAXSIZE=5G
          fi
          cd "${{ steps.vars.outputs.LLVM_WORKSPACE }}"
          BUILD_SCRIPT="toolchain/llvm-project/llvm-build/build.sh"
          MINGW_PY="toolchain/llvm-project/llvm-build/mingw.py"
          if [ "${{ steps.vars.outputs.clean_build }}" != "true" ]; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              sed -i 's|rm -rf ${WORK_DIR}/out|# rm -rf ${WORK_DIR}/out  # skipped for incremental build|' "$BUILD_SCRIPT"
            else
              sed -i '' 's|rm -rf ${WORK_DIR}/out|# rm -rf ${WORK_DIR}/out  # skipped for incremental build|' "$BUILD_SCRIPT"
            fi
            # Upstream robustness: mingw.py uses os.makedirs(target_dir) without exist_ok. Dir may exist from a prior run (incremental) or from another code path in the same run; patch so makedirs is idempotent.
            if [ -f "$MINGW_PY" ]; then
              if [ "$RUNNER_OS" = "Linux" ]; then
                sed -i 's/os\.makedirs(target_dir)/os.makedirs(target_dir, exist_ok=True)/' "$MINGW_PY"
              else
                sed -i '' 's/os\.makedirs(target_dir)/os.makedirs(target_dir, exist_ok=True)/' "$MINGW_PY"
              fi
            fi
          fi
          bash "$BUILD_SCRIPT"

      - name: Archive build output
        id: archive
        shell: bash
        env:
          ARTIFACT_LOCAL_PATH: ${{ env.ARTIFACT_LOCAL_PATH }}
        run: |
          ARTIFACT_LOCAL_PATH="$(echo "$ARTIFACT_LOCAL_PATH" | sed "s|^~|$HOME|")"
          mkdir -p "$ARTIFACT_LOCAL_PATH"

          LLVM_PROJECT_DIR="$LLVM_WORKSPACE/toolchain/llvm-project"
          LLVM_SHA="$(git -C "$LLVM_PROJECT_DIR" rev-parse HEAD)"
          LLVM_SHA_SHORT="${LLVM_SHA:0:7}"
          GITHUB_SHA_SHORT="${GITHUB_SHA:0:7}"
          ARCHIVE_NAME="llvm-${LLVM_SHA_SHORT}_act-${GITHUB_SHA_SHORT}_${RUNNER_OS}_${RUNNER_ARCH}.tar.gz"

          OUT_PATH="$ARTIFACT_LOCAL_PATH/$ARCHIVE_NAME"
          # Pipe through pigz so it works on both GNU tar (Linux) and BSD tar (macOS)
          tar -cf - -C "$LLVM_WORKSPACE" out/llvm-install | pigz -9 > "$OUT_PATH"
          echo "path=$OUT_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
          echo "llvm_sha_short=$LLVM_SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "action_sha_short=$GITHUB_SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "path=$OUT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact to local server
        uses: ./kn-action/.github/actions/upload-artifact-local
        with:
          path: ${{ steps.archive.outputs.path }}

  # Post step: merge Linux x64 artifact into host toolchain, then build/run tests
  cross-copy:
    name: cross-copy (${{ matrix.platform }})
    needs: [build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    env:
      HOST_SUFFIX: ${{ matrix.host_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: [self-hosted, macOS, ARM64, llvm]
            host_suffix: macOS_ARM64
          - platform: macos-x64
            runner: [self-hosted, macOS, X64, llvm]
            host_suffix: macOS_X64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout kn-action
        uses: actions/checkout@v6
        with:
          path: kn-action

      # When skip_build false: use exact artifact names from build job (llvm + action commit). When true: use pattern for latest.
      - name: Set artifact names or patterns
        id: artifacts
        env:
          SKIP_BUILD: ${{ github.event.inputs.skip_build }}
          LLVM_SHA: ${{ needs.build.outputs.llvm_sha_short }}
          ACTION_SHA: ${{ needs.build.outputs.action_sha_short }}
        run: |
          if [ "$SKIP_BUILD" = "true" ]; then
            echo "linux_pattern=llvm-.*_Linux_X64\.tar\.gz" >> "$GITHUB_OUTPUT"
            echo "host_pattern=llvm-.*_${HOST_SUFFIX}\\.tar\\.gz" >> "$GITHUB_OUTPUT"
          else
            echo "linux_artifact_name=llvm-${LLVM_SHA}_act-${ACTION_SHA}_Linux_X64.tar.gz" >> "$GITHUB_OUTPUT"
            echo "host_artifact_name=llvm-${LLVM_SHA}_act-${ACTION_SHA}_${HOST_SUFFIX}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Linux X64 artifact
        uses: ./kn-action/.github/actions/download-artifact-local
        with:
          name: ${{ steps.artifacts.outputs.linux_artifact_name }}
          pattern: ${{ steps.artifacts.outputs.linux_pattern }}
          path: ${{ github.workspace }}/artifacts-in

      - name: Download host artifact
        uses: ./kn-action/.github/actions/download-artifact-local
        with:
          name: ${{ steps.artifacts.outputs.host_artifact_name }}
          pattern: ${{ steps.artifacts.outputs.host_pattern }}
          path: ${{ github.workspace }}/artifacts-in

      - name: Extract artifacts
        id: extract
        run: |
          echo "artifacts-in: $(ls artifacts-in)"
          mkdir -p linux_llvm host_llvm
          TAR_LINUX="$(find artifacts-in -name '*.tar.gz' -path '*Linux*X64*' -print -quit)"
          TAR_HOST="$(find artifacts-in -name '*.tar.gz' -path "*${HOST_SUFFIX}*" -print -quit)"
          if [ -z "$TAR_LINUX" ] || [ ! -f "$TAR_LINUX" ]; then
            echo "::error::Linux X64 artifact not found under artifacts-in. Contents:"
            find artifacts-in -type f 2>/dev/null || true
            exit 1
          fi
          if [ -z "$TAR_HOST" ] || [ ! -f "$TAR_HOST" ]; then
            echo "::error::Host artifact ($HOST_SUFFIX) not found under artifacts-in. Contents:"
            find artifacts-in -type f 2>/dev/null || true
            exit 1
          fi
          echo "host_tar_basename=$(basename "$TAR_HOST")" >> "$GITHUB_OUTPUT"
          tar -xzf "$TAR_LINUX" -C linux_llvm
          # Suppress macOS xattr extended-header warning (LIBARCHIVE.xattr.com.apple.provenance)
          tar -xzf "$TAR_HOST" -C host_llvm 2>/dev/null

      - name: Cross-copy Linux bits into host toolchain (dereference symlinks)
        run: |
          clang_linux_x86_64="$(pwd)/linux_llvm/out/llvm-install"
          clang_host="$(pwd)/host_llvm/out/llvm-install"

          # make sure target folder exists to get consistent copy behavior
          mkdir -p "${clang_host}/include"

          cp -Lrf "${clang_linux_x86_64}/lib/aarch64-linux-ohos" "${clang_host}/lib"
          cp -Lrf "${clang_linux_x86_64}/include/libcxx-ohos" "${clang_host}/include"
          cp -Lrf "${clang_linux_x86_64}/lib/x86_64-linux-ohos" "${clang_host}/lib"
          cp -Lrf "${clang_linux_x86_64}/lib/clang/19/bin" "${clang_host}/lib/clang/19"
          cp -Lrf "${clang_linux_x86_64}/lib/clang/19/include/profile" "${clang_host}/lib/clang/19/include"
          cp -Lrf "${clang_linux_x86_64}/lib/clang/19/include/fuzzer" "${clang_host}/lib/clang/19/include"
          cp -Lrf "${clang_linux_x86_64}/lib/clang/19/share" "${clang_host}/lib/clang/19"
          cp -Lrf "${clang_linux_x86_64}/lib/clang/19/include/sanitizer" "${clang_host}/lib/clang/19/include"
          cp -Lrf "${clang_linux_x86_64}/lib/clang/19/lib" "${clang_host}/lib/clang/19"

      - name: Create test source
        run: |
          mkdir -p test-build
          cat > test-build/main.c << 'EOF'
          #include <stdio.h>
          int main(void) {
            printf("ok\n");
            return 0;
          }
          EOF
          cat > test-build/main.cpp << 'EOF'
          int main() { return 0; }
          EOF

      - name: Build and run host test exe
        run: |
          TC="$(pwd)/host_llvm/out/llvm-install"
          export PATH="$TC/bin:$PATH"
          # Use host platform SDK so toolchain clang gets proper libc (e.g. macOS: xcrun --show-sdk-path)
          SDK="$(xcrun --show-sdk-path)"
          clang -isysroot "$SDK" test-build/main.c -o test-build/test-host
          OUT="$(./test-build/test-host)"
          if [ "$OUT" != "ok" ]; then
            echo "::error::Expected output 'ok', got: $OUT"
            exit 1
          fi

      - name: Download OHOS sysroot (on demand)
        env:
          CLEAN_BUILD: ${{ github.event.inputs.clean_build }}
        run: |
          SYSROOT_DIR="$(pwd)/sysroot-ohos-aarch64"
          SYSROOT_TOP="$OHOS_SYSROOT"
          SYSROOT_URL="https://maven.eazytec-cloud.com/nexus/repository/file-storage/${SYSROOT_TOP}.tar.gz"
          if [ "$CLEAN_BUILD" = "true" ]; then
            echo "Clean build: removing existing sysroot to re-download"
            rm -rf "$SYSROOT_DIR"
          fi
          if [ ! -d "$SYSROOT_DIR/$SYSROOT_TOP" ]; then
            echo "Downloading OHOS aarch64 sysroot..."
            mkdir -p "$SYSROOT_DIR"
            curl -sSL "$SYSROOT_URL" | tar -xzf - -C "$SYSROOT_DIR"
            echo "Sysroot at $SYSROOT_DIR/$SYSROOT_TOP"
            ls -la "$SYSROOT_DIR"
          else
            echo "Using existing sysroot at $SYSROOT_DIR/$SYSROOT_TOP"
          fi

      - name: Build OHOS test program
        run: |
          TC="$(pwd)/host_llvm/out/llvm-install"
          export PATH="$TC/bin:$PATH"
          RESOURCE_DIR="$TC/lib/clang/19"
          SYSROOT="$(pwd)/sysroot-ohos-aarch64/$OHOS_SYSROOT"
          clang++ -std=c++17 test-build/main.cpp \
            -target aarch64-linux-ohos \
            --sysroot "$SYSROOT" \
            -resource-dir "$RESOURCE_DIR" \
            -L"$TC/lib/aarch64-linux-ohos" \
            -o test-build/test-ohos-aarch64
          file test-build/test-ohos-aarch64

      - name: Re-pack and upload host artifact with Linux cross
        run: |
          HOST_BASENAME="${{ steps.extract.outputs.host_tar_basename }}"
          ARCHIVE_NAME="${HOST_BASENAME%.tar.gz}-full.tar.gz"
          tar -cf - -C host_llvm out/llvm-install | pigz -9 > "$ARCHIVE_NAME"
          echo "archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
        id: repack

      - name: Upload merged artifact
        uses: ./kn-action/.github/actions/upload-artifact-local
        with:
          path: ${{ github.workspace }}/${{ steps.repack.outputs.archive_name }}

      - name: Pack test binaries
        id: test_binaries
        env:
          HOST_TAR_BASENAME: ${{ steps.extract.outputs.host_tar_basename }}
        run: |
          # Derive name from host LLVM artifact (works when build was skipped)
          TEST_ARCHIVE="test-binaries-${HOST_TAR_BASENAME#llvm-}"
          tar -cf - -C test-build test-host test-ohos-aarch64 | pigz -9 > "$TEST_ARCHIVE"
          echo "archive_name=$TEST_ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload test binaries artifact
        uses: ./kn-action/.github/actions/upload-artifact-local
        with:
          path: ${{ github.workspace }}/${{ steps.test_binaries.outputs.archive_name }}

  actions-timeline:
    needs: [cross-copy]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      actions: read
    steps:
      - uses: Kesin11/actions-timeline@v3
