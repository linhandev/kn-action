# Build LLVM toolchain for OpenHarmony using repo-managed multi-repo checkout.
# macOS / Windows: runs on host. Linux: runs inside OpenHarmony build env Docker image (empty `container.image` skips Docker; see actions/runner#265).
# Incremental by default: workspace persists next to action checkout. Clean build wipes it first.
# Requires: environment "env" with secret GITCODE_TOKEN (GitCode PAT with read access) for repo sync from gitcode.com.

name: Build LLVM

run-name: ${{ github.event.inputs.run_name || 'Build LLVM' }}

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Wipe workspace and build from scratch'
        default: false
        type: boolean
      run_name:
        description: 'Custom title for this run (shown in Actions UI)'
        required: false
        type: string
  push:
    paths:
      - '.github/workflows/build-llvm.yml'
      - 'scripts/setup-repo-tool.sh'
      - 'scripts/platform_package.sh'
      - 'scripts/ohos-env-prepare-windows.sh'
      - 'scripts/ohos-build-llvm-windows.sh'
      - 'scripts/patches/ohos-llvm-build-py-windows-host.patch'

env:
  MANIFEST_URL: https://gitcode.com/linhandev/manifest.git
  MANIFEST_FILE: llvm-toolchain.xml
  LOCAL_REFERENCE_DIR: ~/git/ci/llvm-project-kmp
  LLVM_WORKSPACE: ${{ github.workspace }}/llvm
  REPO_DIR: ${{ github.workspace }}/bin
  ARTIFACT_LOCAL_PATH: ~/runner/artifact
  OHOS_SYSROOT: sysroot-ohos-aarch64-6.0.2.640-02
  OHOS_SYSROOT_URL: https://maven.eazytec-cloud.com/nexus/repository/file-storage/sysroot-ohos-aarch64-6.0.2.640-02.tar.gz
  OHOS_SYSROOT_CACHE_DIR: ~/runner/cache

jobs:
  build:
    name: build (${{ matrix.runner[1] }}-${{ matrix.runner[2] }})
    environment: env
    outputs:
      llvm_sha_short: ${{ steps.archive.outputs.llvm_sha_short }}
      action_sha_short: ${{ steps.archive.outputs.action_sha_short }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, macOS, ARM64, llvm]
            container_image: ''
            shell: bash
          - runner: [self-hosted, macOS, X64, llvm]
            container_image: ''
            shell: bash
          - runner: [self-hosted, linux, X64, llvm]
            container_image: ghcr.io/${{ github.repository_owner }}/kn-action-linux-llvm-builder:bc3de27
            shell: bash
          - runner: [self-hosted, Windows, X64, llvm]
            container_image: ''
            shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container_image }}
      volumes:
        - ${{ github.workspace }}/../../../artifact:/home/runner/runner/artifact
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout kn-action
        uses: actions/checkout@v6
        with:
          path: kn-action

      - name: Setup environment
        id: vars
        run: |
          AP="${{ env.ARTIFACT_LOCAL_PATH }}"
          AP="${AP/#\~/$HOME}"
          if command -v realpath >/dev/null 2>&1; then
            echo "$(realpath "$AP" 2>/dev/null || echo "$AP")"
          else
            echo "$AP"
          fi
          CLEAN_BUILD="${{ github.event.inputs.clean_build || 'false' }}"

          if [ "$CLEAN_BUILD" = "true" ]; then
            rm -rf "$LLVM_WORKSPACE"
          fi
          mkdir -p "$LLVM_WORKSPACE"

          NEED_ENV_PREPARE="false"
          if [ ! -d "$LLVM_WORKSPACE/prebuilts/cmake" ]; then
            NEED_ENV_PREPARE="true"
          fi

          {
            echo "LLVM_WORKSPACE=$LLVM_WORKSPACE"
            echo "clean_build=$CLEAN_BUILD"
            echo "need_env_prepare=$NEED_ENV_PREPARE"
            echo "repo_dir=$REPO_DIR"
          } | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ENV_HINTS: 1
          CI: 1
        run: |
          set -euo pipefail
          echo "Installing LLVM build deps via Homebrew (swig, git-lfs, java, coreutils, wget, pigz, python)…"
          brew install swig git-lfs java coreutils wget pigz python

      - name: Setup git
        env:
          LLVM_WORKSPACE: ${{ steps.vars.outputs.LLVM_WORKSPACE }}
        run: |
          git config --global --add safe.directory "$LLVM_WORKSPACE/build"
          git config --global --add safe.directory "$LLVM_WORKSPACE/third_party/musl"
          # only set if not already
          git config --global user.email &>/dev/null || git config --global user.email "ci@ci.ci"
          git config --global user.name &>/dev/null || git config --global user.name "ci"

      - name: Setup git credentials for GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if [ -z "${GITCODE_TOKEN}" ]; then
            echo "::error::GITCODE_TOKEN secret is not set. Add it in repo Settings → Secrets and variables → Actions (read-only access is sufficient)."
            exit 1
          fi
          git config --global credential.helper ''
          git config --global --unset-all url."https://linhandev:${GITCODE_TOKEN}@gitcode.com/".insteadOf 2>/dev/null || true
          git config --global url."https://linhandev:${GITCODE_TOKEN}@gitcode.com/".insteadOf "https://gitcode.com/"
          git config --global --add url."https://linhandev:${GITCODE_TOKEN}@gitcode.com/".insteadOf "git@gitcode.com:"

      # Self-hosted Windows runners often execute as a service account (LOCALAPPDATA ≠ the interactive user
      # that installed Python). Probe typical install locations including a fixed path for win-llvm.
      - name: Prepend Python to PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          try_dir() {
            local d="$1"
            if [ -f "$d/python.exe" ]; then
              echo "$d" >> "$GITHUB_PATH"
              return 0
            fi
            return 1
          }
          for v in 314 313 312 311 310; do
            try_dir "${LOCALAPPDATA}/Programs/Python/Python${v}" && exit 0
            try_dir "${PROGRAMFILES}/Python${v}" && exit 0
          done
          # Service accounts often lack the interactive user's LOCALAPPDATA; scan /c/Users/*/AppData/Local/Programs/Python.
          for v in 314 313 312 311 310; do
            for d in /c/Users/*; do
              [ -d "$d" ] || continue
              try_dir "$d/AppData/Local/Programs/Python/Python${v}" && exit 0
            done
          done
          echo "::warning::No Python under LOCALAPPDATA, Program Files, or /c/Users/*/AppData/Local/Programs/Python; relying on PATH"

      # repo forall -c runs under cmd.exe on Windows; single-quoted 'git lfs pull' becomes a bogus executable name — use bash -lc for LFS and put git-lfs on PATH (Git/usr/bin).
      - name: Prepend Git LFS to PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          for d in "/c/PROGRA~1/Git/usr/bin" "/c/PROGRA~1/Git/mingw64/bin" "/c/Program Files/Git/usr/bin" "/c/Program Files/Git/mingw64/bin"; do
            if [ -d "$d" ]; then echo "$d" >> "$GITHUB_PATH"; fi
          done

      - name: Setup repo tool
        run: bash "$GITHUB_WORKSPACE/kn-action/scripts/setup-repo-tool.sh"

      - name: Init repo manifest
        env:
          LLVM_WORKSPACE: ${{ steps.vars.outputs.LLVM_WORKSPACE }}
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          # Init when .repo is missing (first run) or when doing a clean build
          if [ ! -d "$LLVM_WORKSPACE/.repo" ] || [ "${{ steps.vars.outputs.clean_build }}" = "true" ]; then
            cd "$LLVM_WORKSPACE"
            REFERENCE_FLAG=""
            ref_dir="${{ env.LOCAL_REFERENCE_DIR }}"
            ref_dir="${ref_dir/#\~/$HOME}"
            if [ -d "$ref_dir" ]; then
              REFERENCE_FLAG="--reference=$ref_dir"
            fi
            repo init -u "${{ env.MANIFEST_URL }}" -m "${{ env.MANIFEST_FILE }}" $REFERENCE_FLAG
          fi

      - name: Sync source
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          cd "${{ steps.vars.outputs.LLVM_WORKSPACE }}"
          repo sync -c -v -j 16
          # Do not quote: -c git lfs pull must be three argv words. -c 'git lfs pull' is one token with spaces →
          # repo forall uses subprocess with shell=True on Windows and cmd breaks. See .repo/repo/subcmds/forall.py.
          repo forall -c git lfs pull

      - name: Restore git config (remove GitCode credentials)
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if [ -n "${GITCODE_TOKEN}" ]; then
            git config --global --unset-all url."https://linhandev:${GITCODE_TOKEN}@gitcode.com/".insteadOf 2>/dev/null || true
          fi
          git config --global --unset credential.helper 2>/dev/null || true

      - name: Prepare build environment (Linux / macOS)
        if: steps.vars.outputs.need_env_prepare == 'true' && runner.os != 'Windows'
        run: |
          cd "${{ steps.vars.outputs.LLVM_WORKSPACE }}"
          bash -x toolchain/llvm-project/llvm-build/env_prepare.sh

      - name: Prepare build environment (Windows / Git Bash)
        if: steps.vars.outputs.need_env_prepare == 'true' && runner.os == 'Windows'
        run: |
          cd "${{ steps.vars.outputs.LLVM_WORKSPACE }}"
          bash -x "$GITHUB_WORKSPACE/kn-action/scripts/ohos-env-prepare-windows.sh"

      - name: Build LLVM
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export CCACHE_DIR="${{ github.workspace }}/.ccache"
            export CCACHE_MAXSIZE=10G
            # # Cap parallelism to reduce OOM kills in Docker (silent failure with no step logs).
            # export CMAKE_BUILD_PARALLEL_LEVEL="${CMAKE_BUILD_PARALLEL_LEVEL:-4}"
            # echo "Disk/memory before build:" && df -h && free -m || true
          fi
          cd "${{ steps.vars.outputs.LLVM_WORKSPACE }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bash "$GITHUB_WORKSPACE/kn-action/scripts/ohos-build-llvm-windows.sh"
          else
            bash toolchain/llvm-project/llvm-build/build.sh
          fi

      - name: Archive llvm/packages
        id: archive
        env:
          ARTIFACT_LOCAL_PATH: ${{ env.ARTIFACT_LOCAL_PATH }}
          LLVM_WORKSPACE: ${{ steps.vars.outputs.LLVM_WORKSPACE }}
        run: |
          ARTIFACT_LOCAL_PATH="$(echo "$ARTIFACT_LOCAL_PATH" | sed "s|^~|$HOME|")"
          mkdir -p "$ARTIFACT_LOCAL_PATH"

          LLVM_PROJECT_DIR="$LLVM_WORKSPACE/toolchain/llvm-project"
          LLVM_SHA="$(git -C "$LLVM_PROJECT_DIR" rev-parse HEAD)"
          LLVM_SHA_SHORT="${LLVM_SHA:0:7}"
          GITHUB_SHA_SHORT="${GITHUB_SHA:0:7}"

          PACKAGES_DIR="$LLVM_WORKSPACE/packages"
          if [ ! -d "$PACKAGES_DIR" ] || [ -z "$(ls -A "$PACKAGES_DIR" 2>/dev/null)" ]; then
            echo "::error::Expected non-empty directory at $PACKAGES_DIR (e.g. .../llvm/packages on the runner)."
            exit 1
          fi

          ARCHIVE_NAME="llvm-packages-${LLVM_SHA_SHORT}_act-${GITHUB_SHA_SHORT}_${RUNNER_OS}_${RUNNER_ARCH}.tar"
          OUT_PATH="$ARTIFACT_LOCAL_PATH/$ARCHIVE_NAME"
          tar -cf "$OUT_PATH" -C "$LLVM_WORKSPACE" packages
          echo "path=$OUT_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
          echo "llvm_sha_short=$LLVM_SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "action_sha_short=$GITHUB_SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "Uploaded artifact: $OUT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload llvm/packages to local server
        uses: ./kn-action/.github/actions/upload-artifact-local
        with:
          path: ${{ steps.archive.outputs.path }}

  cross-copy:
    name: cross copy on mac arm
    needs: build
    runs-on: [self-hosted, macOS, ARM64, llvm]
    defaults:
      run:
        working-directory: ${{ github.workspace }}/cross-copy-work
    steps:
      - name: Checkout kn-action
        uses: actions/checkout@v6
        with:
          path: kn-action

      - name: Prepare workspace
        # Must not inherit defaults.run.working-directory (cross-copy-work): it does not exist until this step creates it.
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf "${{ github.workspace }}/cross-copy-work"
          mkdir -p "${{ github.workspace }}/cross-copy-work/downloads"

      - name: Download llvm-packages (Linux X64)
        uses: ./kn-action/.github/actions/download-artifact-local
        with:
          name: llvm-packages-${{ needs.build.outputs.llvm_sha_short }}_act-${{ needs.build.outputs.action_sha_short }}_Linux_X64.tar
          path: ${{ github.workspace }}/cross-copy-work/downloads

      - name: Download llvm-packages (macOS ARM64)
        uses: ./kn-action/.github/actions/download-artifact-local
        with:
          name: llvm-packages-${{ needs.build.outputs.llvm_sha_short }}_act-${{ needs.build.outputs.action_sha_short }}_macOS_ARM64.tar
          path: ${{ github.workspace }}/cross-copy-work/downloads

      - name: Download llvm-packages (macOS X64)
        uses: ./kn-action/.github/actions/download-artifact-local
        with:
          name: llvm-packages-${{ needs.build.outputs.llvm_sha_short }}_act-${{ needs.build.outputs.action_sha_short }}_macOS_X64.tar
          path: ${{ github.workspace }}/cross-copy-work/downloads

      - name: Download llvm-packages (Windows X64)
        uses: ./kn-action/.github/actions/download-artifact-local
        with:
          name: llvm-packages-${{ needs.build.outputs.llvm_sha_short }}_act-${{ needs.build.outputs.action_sha_short }}_Windows_X64.tar
          path: ${{ github.workspace }}/cross-copy-work/downloads

      - name: Extract outer tars and merge packages (scripts/platform_package.sh)
        id: merge
        env:
          CLANG_RESOURCE_VERSION: '19'
        run: |
          set -euo pipefail
          DL="$(pwd)/downloads"
          P="llvm-packages-${{ needs.build.outputs.llvm_sha_short }}_act-${{ needs.build.outputs.action_sha_short }}"
          mkdir -p extract-linux extract-mac-arm64 extract-mac-x64 extract-windows staging
          tar -xf "$DL/${P}_Linux_X64.tar" -C extract-linux
          tar -xf "$DL/${P}_macOS_ARM64.tar" -C extract-mac-arm64
          tar -xf "$DL/${P}_macOS_X64.tar" -C extract-mac-x64
          tar -xf "$DL/${P}_Windows_X64.tar" -C extract-windows
          cp -f extract-linux/packages/*.tar.gz staging/
          cp -f extract-mac-arm64/packages/clang-dev-darwin-arm64.tar.gz staging/
          cp -f extract-mac-x64/packages/clang-dev-darwin-x86_64.tar.gz staging/
          w=""
          shopt -s nullglob
          for f in extract-windows/packages/clang-dev-windows*.tar.gz extract-windows/packages/clang-dev-mingw*.tar.gz; do
            w="$f"
            break
          done
          shopt -u nullglob
          if [ -z "$w" ] || [ ! -f "$w" ]; then
            echo "::error::No Windows clang-dev tarball (clang-dev-windows* or clang-dev-mingw*) under extract-windows/packages"
            ls -la extract-windows/packages || true
            exit 1
          fi
          cp -f "$w" staging/clang-dev-windows-x86_64.tar.gz
          ( cd staging && bash "$GITHUB_WORKSPACE/kn-action/scripts/platform_package.sh" )
          # OHOS sysroot for tests comes from Maven in ohos-test jobs, not build-produced ohos-sysroot-dev.tar.gz.
          for p in clang_darwin-arm64 clang_darwin-x86_64 clang_windows-x86_64; do
            D="$(find staging -maxdepth 1 -type d -name "${p}-*" | head -1)"
            if [ -z "$D" ] || [ ! -d "$D" ]; then
              echo "::error::Missing merged $p tree under staging"
              ls -la staging
              exit 1
            fi
            echo "Merged $p -> $D"
          done

      - name: Pack merged Darwin ARM64 toolchain
        id: pack_arm64
        run: |
          set -euo pipefail
          TC="$(find staging -maxdepth 1 -type d -name 'clang_darwin-arm64-*' | head -1)"
          NAME="llvm-merged-ohos-macOS_ARM64-${{ github.run_id }}.tar.gz"
          tar -cf - -C "$(dirname "$TC")" "$(basename "$TC")" | pigz -9 > "$NAME"
          echo "archive=$NAME" >> "$GITHUB_OUTPUT"

      - name: Pack merged Darwin x86_64 toolchain
        id: pack_x64
        run: |
          set -euo pipefail
          TC="$(find staging -maxdepth 1 -type d -name 'clang_darwin-x86_64-*' | head -1)"
          NAME="llvm-merged-ohos-macOS_X64-${{ github.run_id }}.tar.gz"
          tar -cf - -C "$(dirname "$TC")" "$(basename "$TC")" | pigz -9 > "$NAME"
          echo "archive=$NAME" >> "$GITHUB_OUTPUT"

      - name: Pack merged Windows x86_64 toolchain
        id: pack_win
        run: |
          set -euo pipefail
          TC="$(find staging -maxdepth 1 -type d -name 'clang_windows-x86_64-*' | head -1)"
          NAME="llvm-merged-ohos-Windows_X64-${{ github.run_id }}.tar.gz"
          tar -cf - -C "$(dirname "$TC")" "$(basename "$TC")" | pigz -9 > "$NAME"
          echo "archive=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload merged macOS ARM64 OHOS toolchain
        uses: ./kn-action/.github/actions/upload-artifact-local
        with:
          path: ${{ github.workspace }}/cross-copy-work/${{ steps.pack_arm64.outputs.archive }}

      - name: Upload merged macOS X64 OHOS toolchain
        uses: ./kn-action/.github/actions/upload-artifact-local
        with:
          path: ${{ github.workspace }}/cross-copy-work/${{ steps.pack_x64.outputs.archive }}

      - name: Upload merged Windows X64 OHOS toolchain
        uses: ./kn-action/.github/actions/upload-artifact-local
        with:
          path: ${{ github.workspace }}/cross-copy-work/${{ steps.pack_win.outputs.archive }}

  # Build OHOS aarch64 test programs on each self-hosted runner using the same run's artifacts.
  ohos-test-build:
    name: ${{ format('ohos-test-build ({0})', matrix.platform) }}
    needs: [build, cross-copy]
    if: ${{ !cancelled() && needs['cross-copy'].result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: [self-hosted, linux, X64, llvm]
            container_image: ghcr.io/${{ github.repository_owner }}/kn-action-linux-llvm-builder:bc3de27
            host_suffix: Linux_X64
            toolchain_kind: host-llvm-tar
            shell: bash
          - platform: windows-x64
            runner: [self-hosted, Windows, X64, llvm]
            container_image: ''
            host_suffix: Windows_X64
            toolchain_kind: host-llvm-tar
            shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
          - platform: macos-arm64
            runner: [self-hosted, macOS, ARM64, llvm]
            container_image: ''
            host_suffix: macOS_ARM64
            toolchain_kind: merged-darwin
            shell: bash
          - platform: macos-x64
            runner: [self-hosted, macOS, X64, llvm]
            container_image: ''
            host_suffix: macOS_X64
            toolchain_kind: merged-darwin
            shell: bash
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container_image }}
      volumes:
        - ${{ github.workspace }}/../../../artifact:/home/runner/runner/artifact
    defaults:
      run:
        working-directory: ${{ github.workspace }}/ohos-test-work
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout kn-action
        uses: actions/checkout@v6
        with:
          path: kn-action

      - name: Prepare workspace
        # Must not inherit defaults.run.working-directory (ohos-test-work): it does not exist until this step creates it.
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf "${{ github.workspace }}/ohos-test-work"
          mkdir -p "${{ github.workspace }}/ohos-test-work"

      - name: Download llvm-packages (host tar, same naming as build matrix)
        if: matrix.toolchain_kind == 'host-llvm-tar'
        id: dl_linux_pkg
        uses: ./kn-action/.github/actions/download-artifact-local
        with:
          name: llvm-packages-${{ needs.build.outputs.llvm_sha_short }}_act-${{ needs.build.outputs.action_sha_short }}_${{ matrix.host_suffix }}.tar
          path: ${{ github.workspace }}/ohos-test-work/dl

      - name: Download merged Darwin toolchain
        if: matrix.toolchain_kind == 'merged-darwin'
        id: dl_merged
        uses: ./kn-action/.github/actions/download-artifact-local
        with:
          name: llvm-merged-ohos-${{ matrix.host_suffix }}-${{ github.run_id }}.tar.gz
          path: ${{ github.workspace }}/ohos-test-work/dl

      # Linux uses a fixed OH package name; Windows uses whatever clang-dev-*.tar.gz the Windows build emitted (exclude darwin).
      - name: Layout toolchain and sysroot (Linux / Windows host tar)
        if: matrix.toolchain_kind == 'host-llvm-tar'
        run: |
          set -euo pipefail
          mkdir -p outer
          tar -xf "${{ steps.dl_linux_pkg.outputs.path }}" -C outer
          if [ "${{ matrix.platform }}" = "linux-x64" ]; then
            tar -xzf outer/packages/clang-dev-linux-x86_64.tar.gz -C .
          else
            pkg=""
            shopt -s nullglob
            for f in outer/packages/clang-dev-windows*.tar.gz outer/packages/clang-dev-mingw*.tar.gz outer/packages/clang-dev-msvc*.tar.gz; do
              if [ -f "$f" ]; then pkg="$f"; break; fi
            done
            if [ -z "$pkg" ]; then
              for f in outer/packages/clang-dev-*.tar.gz; do
                case "$f" in *darwin*) continue ;; esac
                pkg="$f"
                break
              done
            fi
            shopt -u nullglob
            if [ -z "${pkg:-}" ] || [ ! -f "$pkg" ]; then
              echo "::error::No clang-dev host tarball under outer/packages"; ls -la outer/packages || true
              exit 1
            fi
            echo "Extracting toolchain package: $pkg"
            tar -xzf "$pkg" -C .
          fi
          CACHE_BASE="${OHOS_SYSROOT_CACHE_DIR:-~/runner/cache}"
          CACHE_BASE="${CACHE_BASE/#\~/$HOME}"
          mkdir -p "$CACHE_BASE"
          ARCHIVE="$CACHE_BASE/${OHOS_SYSROOT}.tar.gz"
          if [ ! -f "$ARCHIVE" ]; then curl -fsSL -o "$ARCHIVE" "$OHOS_SYSROOT_URL"; fi
          if [ ! -d "$CACHE_BASE/${OHOS_SYSROOT}" ]; then tar -xzf "$ARCHIVE" -C "$CACHE_BASE"; fi
          ln -sfn "$CACHE_BASE/${OHOS_SYSROOT}" "$(pwd)/sysroot"
          test -d sysroot
          if [ ! -d clang-dev ] && [ ! -d clang ]; then
            echo "::error::Expected clang-dev/ or clang/ next to sysroot"; ls -la
            exit 1
          fi
          if [ ! -d clang-dev/bin ] && [ ! -d clang/bin ]; then
            echo "::error::Expected clang-dev/bin or clang/bin"; find . -maxdepth 5 | head -80
            exit 1
          fi

      - name: Layout merged toolchain + sysroot (Darwin host)
        if: matrix.toolchain_kind == 'merged-darwin'
        run: |
          set -euo pipefail
          W="${{ github.workspace }}/ohos-test-work"
          tar -xzf "${{ steps.dl_merged.outputs.path }}" -C "$W"
          CACHE_BASE="${OHOS_SYSROOT_CACHE_DIR:-~/runner/cache}"
          CACHE_BASE="${CACHE_BASE/#\~/$HOME}"
          mkdir -p "$CACHE_BASE"
          ARCHIVE="$CACHE_BASE/${OHOS_SYSROOT}.tar.gz"
          if [ ! -f "$ARCHIVE" ]; then curl -fsSL -o "$ARCHIVE" "$OHOS_SYSROOT_URL"; fi
          if [ ! -d "$CACHE_BASE/${OHOS_SYSROOT}" ]; then tar -xzf "$ARCHIVE" -C "$CACHE_BASE"; fi
          ln -sfn "$CACHE_BASE/${OHOS_SYSROOT}" "$W/sysroot"
          test -d "$(find "$W" -maxdepth 1 -type d -name 'clang_darwin-*' | head -1)"
          test -d "$W/sysroot"

      - name: Write OHOS test sources
        run: |
          SUF="${{ matrix.host_suffix }}"
          mkdir -p src
          cat > src/test.c << EOF
          #include <stdio.h>
          int main(void) {
            printf("ok_ohos_c_${SUF}\\n");
            return 0;
          }
          EOF
          cat > src/test.cpp << EOF
          #include <iostream>
          int main() {
            std::cout << "ok_ohos_cpp_${SUF}\\n";
            return 0;
          }
          EOF

      # Merged Darwin trees live under clang_darwin-*/bin; Linux/Windows host tars unpack to clang-dev/bin (same OHOS driver names from upstream).
      - name: Cross-compile OHOS aarch64 (C and C++)
        run: |
          set -euo pipefail
          W="$(pwd)"
          BIN=""
          if [ "${{ matrix.toolchain_kind }}" = "host-llvm-tar" ]; then
            for d in "$W/clang-dev/bin" "$W/clang/bin"; do
              if [ -d "$d" ]; then BIN="$d"; break; fi
            done
          else
            case "${{ matrix.platform }}" in
              macos-arm64) PAT='clang_darwin-arm64-*' ;;
              macos-x64) PAT='clang_darwin-x86_64-*' ;;
              *) echo "::error::unexpected platform ${{ matrix.platform }}"; exit 1 ;;
            esac
            TC="$(find "$W" -maxdepth 1 -type d -name "$PAT" | head -1)"
            [ -n "$TC" ] && [ -d "$TC/bin" ] || { echo "::error::No merged Darwin toolchain ($PAT) under $W"; ls -la "$W" || true; exit 1; }
            BIN="$TC/bin"
          fi
          [ -n "$BIN" ] || { echo "::error::No toolchain bin under $W"; exit 1; }
          OHOS_CC="$BIN/aarch64-unknown-linux-ohos-clang"
          [ -x "$OHOS_CC" ] || OHOS_CC="$BIN/aarch64-linux-ohos-clang"
          [ -x "$OHOS_CC" ] || { echo "::error::No aarch64 OHOS clang in $BIN"; ls -la "$BIN"; exit 1; }
          OHOS_CXX="$BIN/aarch64-unknown-linux-ohos-clang++"
          [ -x "$OHOS_CXX" ] || OHOS_CXX="$BIN/aarch64-linux-ohos-clang++"
          [ -x "$OHOS_CXX" ] || { echo "::error::No aarch64 OHOS clang++ in $BIN"; ls -la "$BIN"; exit 1; }
          chmod +x "$OHOS_CC" "$OHOS_CXX" 2>/dev/null || true
          echo "OHOS_CC=$OHOS_CC OHOS_CXX=$OHOS_CXX"
          set +e
          CLOG="$("$OHOS_CC" -O2 -o src/hello_ohos_c src/test.c 2>&1)"; CRC=$?
          set -e
          if [ "$CRC" -ne 0 ]; then echo "::error::C compile failed: $CLOG"; exit 1; fi
          set +e
          CXXLOG="$("$OHOS_CXX" -std=c++17 -O2 -o src/hello_ohos_cpp src/test.cpp 2>&1)"; CXXRC=$?
          set -e
          if [ "$CXXRC" -ne 0 ]; then echo "::error::C++ compile failed: $CXXLOG"; exit 1; fi
          if command -v file >/dev/null 2>&1; then file src/hello_ohos_c src/hello_ohos_cpp; else ls -la src/hello_ohos_c src/hello_ohos_cpp; fi

      - name: Pack test binaries
        id: test_pack
        run: |
          set -euo pipefail
          NAME="test-binaries-ohos-${{ matrix.host_suffix }}-${{ github.run_id }}.tar.gz"
          tar -czf "$NAME" -C src hello_ohos_c hello_ohos_cpp
          echo "archive_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload test binaries
        uses: ./kn-action/.github/actions/upload-artifact-local
        with:
          path: ${{ github.workspace }}/ohos-test-work/${{ steps.test_pack.outputs.archive_name }}

  hdc-ohos-verify:
    name: hdc OHOS verify (mac ARM)
    needs: [ohos-test-build]
    if: ${{ needs['ohos-test-build'].result == 'success' }}
    runs-on: [self-hosted, macOS, ARM64, llvm]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout kn-action
        uses: actions/checkout@v6
        with:
          path: kn-action

      - name: Download test binaries
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p hdc-verify/dl
          SCRIPT="$GITHUB_WORKSPACE/kn-action/.github/actions/download-artifact-local/download.sh"
          export INPUT_SERVER_URL="${INPUT_SERVER_URL:-http://192.168.3.5:8765}"
          export INPUT_CACHE_DIR="${INPUT_CACHE_DIR:-~/runner/artifact}"
          RID="${{ github.run_id }}"
          for suf in Linux_X64 Windows_X64 macOS_ARM64 macOS_X64; do
            export INPUT_NAME="test-binaries-ohos-${suf}-${RID}.tar.gz"
            export INPUT_PATH="${{ github.workspace }}/hdc-verify/dl"
            bash "$SCRIPT"
          done

      - name: Pick hdc target and record API level
        run: |
          set -euo pipefail
          HDC_BIN="${HDC:-}"
          if [ -z "$HDC_BIN" ] && [ -x "/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/toolchains/hdc" ]; then
            HDC_BIN="/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/toolchains/hdc"
          fi
          HDC_BIN="${HDC_BIN:-$(command -v hdc || true)}"
          if [ -z "$HDC_BIN" ] || [ ! -x "$HDC_BIN" ]; then
            echo "::error::hdc not found; set HDC or install DevEco toolchains"
            exit 1
          fi
          echo "HDC_BIN=$HDC_BIN" >> "$GITHUB_ENV"
          T=()
          while IFS= read -r line; do
            T+=("$line")
          done < <("$HDC_BIN" list targets 2>/dev/null | sed '/^\s*$/d')
          n="${#T[@]}"
          if [ "$n" -lt 1 ]; then
            echo "::error::No hdc targets (connect one device)."
            "$HDC_BIN" list targets || true
            exit 1
          fi
          idx=$((RANDOM % n))
          TARGET="${T[$idx]}"
          # First column if hdc prints "SN\tName\tStatus"
          TARGET="${TARGET%%$'\t'*}"
          TARGET="$(echo "$TARGET" | tr -d '\r')"
          echo "HDC_TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "### hdc" >> "$GITHUB_STEP_SUMMARY"
          echo "- Selected target (${n} available): \`$TARGET\`" >> "$GITHUB_STEP_SUMMARY"
          API=""
          for _try in \
            "param get const.product.os.dist.apiname" \
            "param get const.ohos.apiversion" \
            "param get const.build.os.apiversion"; do
            API="$("$HDC_BIN" -t "$TARGET" shell $_try 2>/dev/null | tr -d '\r' | head -1)" || true
            [ -n "$API" ] && break
          done
          if [ -n "$API" ]; then
            echo "- API / OS info: \`$API\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- API / OS info: (could not read via \`param get\`; device may restrict shell)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Extract and run OHOS ELFs
        run: |
          set -euo pipefail
          ROOT="${{ github.workspace }}/hdc-verify"
          DL="$ROOT/dl"
          RID="${{ github.run_id }}"
          mkdir -p "$ROOT/run/linux" "$ROOT/run/windows" "$ROOT/run/arm64" "$ROOT/run/x64"
          tar -xzf "$DL/test-binaries-ohos-Linux_X64-${RID}.tar.gz" -C "$ROOT/run/linux"
          tar -xzf "$DL/test-binaries-ohos-Windows_X64-${RID}.tar.gz" -C "$ROOT/run/windows"
          tar -xzf "$DL/test-binaries-ohos-macOS_ARM64-${RID}.tar.gz" -C "$ROOT/run/arm64"
          tar -xzf "$DL/test-binaries-ohos-macOS_X64-${RID}.tar.gz" -C "$ROOT/run/x64"
          REMOTE_BASE=/data/local/tmp/llvm-ci-${{ github.run_id }}
          HDC_T() { "$HDC_BIN" -t "$HDC_TARGET" "$@"; }
          HDC_T shell mkdir -p "$REMOTE_BASE"
          run_one() {
            local dir="$1" suf="$2"
            for kind in c cpp; do
              if [ "$kind" = c ]; then b=hello_ohos_c; exp="ok_ohos_c_${suf}"; else b=hello_ohos_cpp; exp="ok_ohos_cpp_${suf}"; fi
              RPATH="$REMOTE_BASE/${suf}_${kind}"
              HDC_T file send "$dir/$b" "$RPATH"
              HDC_T shell chmod 755 "$RPATH"
              OUT=$(HDC_T shell "$RPATH" 2>&1) || true
              echo "output ($suf $kind): $OUT"
              echo "$OUT" | grep -q "$exp" || { echo "::error::Expected '$exp' in output"; exit 1; }
            done
          }
          run_one "$ROOT/run/linux" Linux_X64
          run_one "$ROOT/run/windows" Windows_X64
          run_one "$ROOT/run/arm64" macOS_ARM64
          run_one "$ROOT/run/x64" macOS_X64
          echo "All hdc OHOS smoke checks passed." >> "$GITHUB_STEP_SUMMARY"

  actions-timeline:
    # Runs after hdc sink; if: always() so the timeline still renders when hdc is skipped.
    needs: [hdc-ohos-verify]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      actions: read
    steps:
      - uses: Kesin11/actions-timeline@v3
