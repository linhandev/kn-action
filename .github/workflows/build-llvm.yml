# Build LLVM toolchain for OpenHarmony using repo-managed multi-repo checkout.
# macOS: runs on host. Linux: runs inside OpenHarmony build env Docker image.
# Incremental by default: workspace persists next to action checkout. Clean build wipes it first.
# Requires: environment "env" with secret GITCODE_TOKEN (GitCode PAT with read access) for repo sync from gitcode.com.

name: Build LLVM

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Wipe workspace and build from scratch'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - '.github/workflows/build-llvm.yml'

env:
  MANIFEST_URL: https://gitcode.com/linhandev/manifest.git
  MANIFEST_FILE: llvm-toolchain.xml
  LOCAL_REFERENCE_DIR: ~/git/ci/llvm-project-kmp

jobs:
  build:
    environment: env
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: run on host (no container)
          - runner: [self-hosted, macOS, ARM64, llvm]
            container_image: ''
          # Linux: DaoCloud mirror (https://github.com/DaoCloud/public-image-mirror)
          - runner: [self-hosted, linux, X64, llvm]
            # container_image: swr.cn-north-4.myhuaweicloud.com/ci-service/openharmony-release-build-env-jnlp:1.0.3
            # container_image: m.daocloud.io/docker.io/library/ubuntu:20.04
            container_image: ubuntu:20.04
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container_image }}
    steps:
      - name: Checkout kn-action
        uses: actions/checkout@v6

      - name: Setup environment
        id: vars
        run: |
          CLEAN_BUILD="${{ github.event.inputs.clean_build || 'false' }}"
          LLVM_WORKSPACE="$GITHUB_WORKSPACE/llvm"
          ls -lah $LLVM_WORKSPACE

          if [ "$CLEAN_BUILD" = "true" ]; then
            rm -rf "$LLVM_WORKSPACE"
          fi
          mkdir -p "$LLVM_WORKSPACE"

          NEED_ENV_PREPARE="false"
          if [ ! -d "$LLVM_WORKSPACE/prebuilts/cmake" ]; then
            NEED_ENV_PREPARE="true"
          fi
          {
            echo "LLVM_WORKSPACE=$LLVM_WORKSPACE"
            echo "clean_build=$CLEAN_BUILD"
            echo "need_env_prepare=$NEED_ENV_PREPARE"
          } | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git build-essential swig python3-dev libedit-dev libncurses5-dev binutils-dev gcc-multilib abigail-tools elfutils pkg-config autoconf autoconf-archive libxml2 wget
          apt install -y curl python3-requests git-lfs
          # repo-py3 and other tools expect 'python'; Ubuntu 20.04 has only python3
          ln -sf "$(command -v python3)" /usr/bin/python

      - name: Setup git
        env:
          LLVM_WORKSPACE: ${{ steps.vars.outputs.LLVM_WORKSPACE }}
        run: |
          git config --global --add safe.directory "$LLVM_WORKSPACE/build"
          git config --global --add safe.directory "$LLVM_WORKSPACE/third_party/musl"
          git config --global user.email "ci@ci.ci"
          git config --global user.name "ci"

      - name: Setup git credentials for GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if [ -z "${GITCODE_TOKEN}" ]; then
            echo "::error::GITCODE_TOKEN secret is not set. Add it in repo Settings → Secrets and variables → Actions (GitCode token with read access)."
            exit 1
          fi
          # Disable credential helper so we rely only on URL-embedded token (avoids cached bad credentials)
          git config --global credential.helper ''
          # Clear any persisted insteadOf from prior runs (self-hosted runners retain global config)
          git config --global --unset-all url."https://linhandev:${GITCODE_TOKEN}@gitcode.com/".insteadOf 2>/dev/null || true
          # HTTPS: so repo sync uses token for https://gitcode.com/...
          git config --global url."https://linhandev:${GITCODE_TOKEN}@gitcode.com/".insteadOf "https://gitcode.com/"
          # SSH→HTTPS: use --add so both rules are kept (second would overwrite first otherwise)
          git config --global --add url."https://linhandev:${GITCODE_TOKEN}@gitcode.com/".insteadOf "git@gitcode.com:"

      - name: Check repo tool
        id: check_repo
        run: |
          # Only skip setup when repo is already on PATH (e.g. system-installed).
          # When bin/repo exists but isn't on PATH, we still need the setup step to add it to GITHUB_PATH.
          if command -v repo &>/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup repo tool
        if: steps.check_repo.outputs.ready != 'true'
        run: |
          set -e
          REPO_BIN="$GITHUB_WORKSPACE/bin/repo"
          REPO_DIR="$(dirname "$REPO_BIN")"
          mkdir -p "$REPO_DIR"
          if [ ! -x "$REPO_BIN" ]; then
            curl -fSL -o "$REPO_BIN" "https://gitee.com/oschina/repo/raw/fork_flow/repo-py3"
            head -c 2 "$REPO_BIN" | grep -q '#!' || { echo "::error::Downloaded repo script invalid (no shebang)"; exit 1; }
            chmod a+x "$REPO_BIN"
            pip3 install requests 2>/dev/null || true
          fi
          echo "$REPO_DIR" >> "$GITHUB_PATH"
          export PATH="$REPO_DIR:$PATH"
          # Run with python3 explicitly so shebang/python symlink is not required
          python3 "$REPO_BIN" --version

      - name: Init repo manifest
        env:
          LLVM_WORKSPACE: ${{ steps.vars.outputs.LLVM_WORKSPACE }}
        run: |
          ls -lah
          # Init when .repo is missing (first run) or when doing a clean build
          if [ ! -d "$LLVM_WORKSPACE/.repo" ] || [ "${{ steps.vars.outputs.clean_build }}" = "true" ]; then
            cd "$LLVM_WORKSPACE"
            REFERENCE_FLAG=""
            if [ -d "${{ env.LOCAL_REFERENCE_DIR }}" ]; then
              REFERENCE_FLAG="--reference=${{ env.LOCAL_REFERENCE_DIR }}"
            fi
            repo init -u "${{ env.MANIFEST_URL }}" -m "${{ env.MANIFEST_FILE }}" $REFERENCE_FLAG
          fi

      - name: Sync source
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          cd "${{ steps.vars.outputs.LLVM_WORKSPACE }}"
          repo sync -c -v -j 16
          repo forall -c 'git lfs pull'

      - name: Prepare build environment
        if: steps.vars.outputs.need_env_prepare == 'true'
        run: |
          cd "${{ steps.vars.outputs.LLVM_WORKSPACE }}"
          bash -x toolchain/llvm-project/llvm-build/env_prepare.sh

      - name: Build LLVM
        run: |
          cd "${{ steps.vars.outputs.LLVM_WORKSPACE }}"
          BUILD_SCRIPT="toolchain/llvm-project/llvm-build/build.sh"
          if [ "${{ steps.vars.outputs.clean_build }}" != "true" ]; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              sed -i 's|rm -rf ${WORK_DIR}/out|# rm -rf ${WORK_DIR}/out  # skipped for incremental build|' "$BUILD_SCRIPT"
            else
              sed -i '' 's|rm -rf ${WORK_DIR}/out|# rm -rf ${WORK_DIR}/out  # skipped for incremental build|' "$BUILD_SCRIPT"
            fi
          fi
          bash "$BUILD_SCRIPT"

      # TODO: determine build output path and archive format
      # - name: Archive build output
      #   id: archive
      #   run: |
      #     GITHUB_SHA_SHORT="${GITHUB_SHA:0:7}"
      #     ARCHIVE_NAME="llvm-toolchain_act-${GITHUB_SHA_SHORT}_${RUNNER_OS}_${RUNNER_ARCH}.tar.gz"
      #     OUT_PATH="$ARTIFACT_LOCAL_PATH/$ARCHIVE_NAME"
      #     tar -cf - -C "$LLVM_WORKSPACE" out | gzip -9 > "$OUT_PATH"
      #     echo "path=$OUT_PATH" >> "$GITHUB_OUTPUT"
      #     echo "name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
