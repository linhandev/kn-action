# Cancel workflow runs except: currently running (in_progress) and the single most recent pending (queued) run.
# When triggered, applies to all workflows in the repo.

name: Cancel pending runs

on:
  workflow_dispatch:

jobs:
  cancel:
    name: Cancel old runs
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel runs except current and last pending (all workflows)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const statuses = ['in_progress', 'queued', 'waiting'];

            const { data: workflowsData } = await github.rest.actions.listRepoWorkflows({ owner, repo, per_page: 100 });
            const workflows = workflowsData.workflows || [];
            let totalCancelled = 0;

            for (const workflow of workflows) {
              const { data: runsData } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflow.id,
                per_page: 100,
              });
              const runs = (runsData.workflow_runs || []).filter(r => statuses.includes(r.status));
              if (runs.length === 0) continue;

              const toKeep = new Set();
              toKeep.add(context.runId);
              runs.filter(r => r.status === 'in_progress').forEach(r => toKeep.add(r.id));
              const pending = runs.filter(r => r.status === 'queued' || r.status === 'waiting');
              if (pending.length > 0) {
                const lastPending = pending.sort((a, b) => (b.run_number || 0) - (a.run_number || 0))[0];
                toKeep.add(lastPending.id);
              }

              const toCancel = runs.filter(r => !toKeep.has(r.id));
              for (const run of toCancel) {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                console.log(`[${workflow.name}] Cancelled run #${run.run_number} (id: ${run.id})`);
                totalCancelled++;
              }
            }
            console.log(`Done. Cancelled ${totalCancelled} run(s) across all workflows.`);
