# Build Kotlin for OpenHarmony: clone CPF-KMP-CMP/kotlin from GitCode and run scripts/build-ohos.sh
# Target: Mac ARM64 self-hosted runner. Build steps per: linhandev.github.io/_posts/KMP/2026-02-11-Building-Kotlin (mac arm)
# Requires: runner env has GitCode SSH access configured (no secrets used).
# Incremental cache: RUNNER_TEMP is removed on job end; use cache_root (or default $HOME/kn-action-ci) for persistent cache across jobs.

name: Build Kotlin

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
      pr_number:
        description: 'PR number to merge into branch (use with branch)'
        required: false
      commit:
        description: 'Commit SHA to build (if set, overrides branch/pr)'
        required: false
      artifact_destination:
        description: 'Where to save artifact, github or ~/runner/artifact'
        required: false
        default: 'local'
        type: choice
        options:
          - local
          - github
      maven_proxy_url:
        description: 'Maven proxy URL (empty to disable)'
        required: false
        default: 'http://localhost:8081/repository/kotlin-proxy-group/'
  push:
    paths:
      - '.github/workflows/build-kotlin.yml'
      - '.github/actions/prepare-repo/*'
      - '.github/scripts/maven-proxy.init.gradle'

env:
  REPO_URL: git@gitcode.com:CPF-KMP-CMP/kotlin.git
  KOTLIN_BRANCH: next/2.2.21-OH.0.1.0-01  # default branch for push trigger only
  WORKSPACE_DIR: ci-workspace
  LOCAL_REFERENCE_DIR: ~/git/ci/
  DEFAULT_MAVEN_PROXY_URL: http://localhost:8081/repository/kotlin-proxy-group/

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, kotlin]
    steps:
      - name: Checkout kn-action
        uses: actions/checkout@v6

      - name: Set up Java 8
        id: java8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup environment
        id: vars
        run: |
          BRANCH="${{ github.event.inputs.branch || env.KOTLIN_BRANCH }}"
          COMMIT="${{ github.event.inputs.commit }}"
          PR_NUMBER="${{ github.event.inputs.pr_number }}"
          INCREMENTAL="${{ github.event.inputs.incremental || 'true' }}"
          ARTIFACT_DEST="${{ github.event.inputs.artifact_destination || 'local' }}"
          PROXY_URL="${{ github.event.inputs.maven_proxy_url || env.DEFAULT_MAVEN_PROXY_URL }}"

          if [ "$INCREMENTAL" = "true" ]; then
            CI_CACHE_ROOT="$HOME/runner/cache/"
          else
            CI_CACHE_ROOT="$RUNNER_TEMP/cache/"
          fi
          mkdir -p "$CI_CACHE_ROOT"

          GRADLE_USER_HOME="${CI_CACHE_ROOT}gradle_user_home"
          KONAN_DATA_DIR="${CI_CACHE_ROOT}konan_data"
          ARTIFACT_LOCAL_PATH="$HOME/runner/artifact"
          mkdir -p "$GRADLE_USER_HOME" "$KONAN_DATA_DIR" "$ARTIFACT_LOCAL_PATH"

          DEVELOPER_DIR=/Applications/Xcode-26.2.app/Contents/Developer
          JDK_18="${{ steps.java8.outputs.path }}"

          echo "java version: $(java -version 2>&1 | head -1)" >> "$GITHUB_STEP_SUMMARY"

          tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT" <<EOF
          JDK_18=$JDK_18
          DEVELOPER_DIR=$DEVELOPER_DIR
          GRADLE_USER_HOME=$GRADLE_USER_HOME
          KONAN_DATA_DIR=$KONAN_DATA_DIR
          MAVEN_PROXY_URL=$PROXY_URL
          ARTIFACT_LOCAL_PATH=$ARTIFACT_LOCAL_PATH
          branch=$BRANCH
          commit=$COMMIT
          pr_number=$PR_NUMBER
          artifact_destination=$ARTIFACT_DEST
          EOF

      - name: Prepare Kotlin repo
        id: kotlin
        uses: ./.github/actions/prepare-repo
        with:
          repo_url: ${{ env.REPO_URL }}
          branch: ${{ steps.vars.outputs.branch }}
          commit: ${{ steps.vars.outputs.commit }}
          pr_number: ${{ steps.vars.outputs.pr_number }}
          workspace_dir: ${{ env.WORKSPACE_DIR }}
          local_reference_dir: ${{ env.LOCAL_REFERENCE_DIR }}

      - name: Configure Maven proxy
        id: maven_proxy
        run: |
          if [ -z "$MAVEN_PROXY_URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Maven proxy: disabled"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

          mkdir -p "$GRADLE_USER_HOME/init.d"
          cp "$GITHUB_WORKSPACE/.github/scripts/maven-proxy.init.gradle" "$GRADLE_USER_HOME/init.d/"
          echo "Gradle: init script installed to $GRADLE_USER_HOME/init.d/"

          mkdir -p ~/.m2
          [ -f ~/.m2/settings.xml ] && cp ~/.m2/settings.xml ~/.m2/settings.xml.proxy-bak
          cat > ~/.m2/settings.xml <<EOF
          <settings><mirrors><mirror>
            <id>maven-proxy</id><mirrorOf>central</mirrorOf>
            <url>$MAVEN_PROXY_URL</url>
          </mirror></mirrors></settings>
          EOF
          echo "Maven: mirror set to $MAVEN_PROXY_URL"

      - name: Build Kotlin
        run: |
          cd "${{ env.WORKSPACE_DIR }}"
          bash scripts/build-ohos.sh

      - name: Restore Maven settings
        if: always() && steps.maven_proxy.outputs.enabled == 'true'
        run: |
          if [ -f ~/.m2/settings.xml.proxy-bak ]; then
            mv ~/.m2/settings.xml.proxy-bak ~/.m2/settings.xml
          else
            rm -f ~/.m2/settings.xml
          fi

      - name: Archive build output
        id: archive
        run: |
          KOTLIN_SHA="${{ steps.kotlin.outputs.sha }}"
          KOTLIN_SHA_SHORT="${KOTLIN_SHA:0:7}"
          GITHUB_SHA_SHORT="${GITHUB_SHA:0:7}"
          ARCHIVE_NAME="kotlin-${KOTLIN_SHA_SHORT}_act-${GITHUB_SHA_SHORT}_${RUNNER_OS}_${RUNNER_ARCH}.tar.gz"

          OUT_PATH="$ARTIFACT_LOCAL_PATH/$ARCHIVE_NAME"
          tar -cf - -C "${{ env.WORKSPACE_DIR }}" build/repo | gzip -9 > "$OUT_PATH"
          echo "path=$OUT_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to GitHub
        if: steps.vars.outputs.artifact_destination == 'github'
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-ohos-build
          path: ${{ steps.archive.outputs.path }}
          retention-days: 14
