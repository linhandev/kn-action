# Build Kotlin for OpenHarmony: clone CPF-KMP-CMP/kotlin from GitCode and run scripts/build-ohos.sh
# Target: Mac ARM64 self-hosted runner. Build steps per: linhandev.github.io/_posts/KMP/2026-02-11-Building-Kotlin (mac arm)
# Requires: runner env has GitCode SSH access configured (no secrets used).
# Incremental by default: caches in $HOME/runner/cache/. Clean build uses a fresh RUNNER_TEMP dir for Gradle/Konan.

name: Build Kotlin

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: develop-2.2.21-OH
      pr_number:
        description: 'PR number to merge into branch (use with branch)'
        required: false
      commit:
        description: 'Commit SHA to build (if set, overrides branch/pr)'
        required: false
      artifact_destination:
        description: 'Where to save artifact, github or ~/runner/artifact'
        required: false
        default: 'local'
        type: choice
        options:
          - local
          - github
      clean_build:
        description: 'Discard Gradle/Konan caches and rebuild from scratch'
        required: false
        default: false
        type: boolean
      use_maven_proxy:
        description: 'Use local maven proxy to speed up build'
        required: true
        default: true
        type: boolean
  push:
    paths:
      - '.github/workflows/build-kotlin.yml'
      - '.github/actions/prepare-repo/*'
      - 'scripts/maven-proxy.init.gradle'

# default or global config
env:
  DEFAULT_KOTLIN_BRANCH: develop-2.2.21-OH
  DEFAULT_CLEAN_BUILD: false
  DEFAULT_ARTIFACT_DESTINATION: local
  DEFAULT_MAVEN_PROXY_URL: http://localhost:8080/releases
  REPO_URL: git@gitcode.com:CPF-KMP-CMP/kotlin.git
  WORKSPACE_DIR: ci-workspace
  LOCAL_REFERENCE_DIR: ~/git/ci/
  PERSISTED_CACHE_ROOT: ~/runner/cache
  ARTIFACT_LOCAL_PATH: ~/runner/artifact
  DEVELOPER_DIR: /Applications/Xcode-26.2.app/Contents/Developer/

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, macOS, ARM64, kotlin]
          - runner: [self-hosted, macOS, X64, kotlin]
          - runner: [self-hosted, linux, X64, kotlin]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout kn-action
        uses: actions/checkout@v6
        with:
          path: kn-action

      - name: Set up Java 8
        id: java8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Set up Java 11
        # required for mac x64 only
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
  
      - name: Set up Java 21
        # required for linux only
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup environment
        id: vars
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            /usr/bin/xcrun -f bitcode-build-tool
          fi
          CLEAN_CACHE_ROOT="${RUNNER_TEMP}/clean-cache"
          PERSISTED_CACHE_ROOT="$(echo "${{ env.PERSISTED_CACHE_ROOT }}/" | sed "s|^~|$HOME|")"
          CLEAN_BUILD="${{ github.event_name == 'schedule' && 'true' || github.event.inputs.clean_build || env.DEFAULT_CLEAN_BUILD }}"
          if [ "$CLEAN_BUILD" = "true" ]; then
            CI_CACHE_ROOT="${CLEAN_CACHE_ROOT}/"
          else
            CI_CACHE_ROOT="${PERSISTED_CACHE_ROOT}"
          fi

          PROXY_URL="${{ github.event.inputs.use_maven_proxy != 'false' && env.DEFAULT_MAVEN_PROXY_URL || '' }}"
          echo "PROXY_URL from setting: $PROXY_URL"
          if [ -n "$PROXY_URL" ]; then
            # Require only that the host responds (any HTTP status); -f would fail on 4xx/5xx (e.g. 404 on /releases)
            HTTP_CODE=$(curl -so /dev/null -w '%{http_code}' --connect-timeout 3 --max-time 5 "$PROXY_URL" || true)
            if [ -z "$HTTP_CODE" ] || [ "$HTTP_CODE" = "000" ]; then
              echo "Proxy unreachable (no response or connection failed), clearing PROXY_URL"
              PROXY_URL=""
            else
              echo "Proxy reachable (HTTP $HTTP_CODE)"
            fi
          fi
          echo "PROXY_URL after network test: $PROXY_URL"

          echo "## Run Settings" >> "$GITHUB_STEP_SUMMARY"

          echo "java_version=$(java -version 2>&1 | head -1)" >> "$GITHUB_STEP_SUMMARY"

          {
            echo "branch=${{ github.event.inputs.branch || env.DEFAULT_KOTLIN_BRANCH }}"
            echo "commit=${{ github.event.inputs.commit }}"
            echo "pr_number=${{ github.event.inputs.pr_number }}"
            echo "clean_build=$CLEAN_BUILD"
            echo "artifact_destination=${{ github.event.inputs.artifact_destination || env.DEFAULT_ARTIFACT_DESTINATION }}"
            echo "persisted_cache_root=$PERSISTED_CACHE_ROOT"
            echo "ci_cache_root=$CI_CACHE_ROOT"
            echo "artifact_local_path="$(echo "${{ env.ARTIFACT_LOCAL_PATH }}" | sed "s|^~|$HOME|")""
            echo "gradle_user_home=${CI_CACHE_ROOT}gradle_user_home"
            echo "konan_data_dir=${CI_CACHE_ROOT}/konan_data"
            echo "maven_local_repo=${CI_CACHE_ROOT}/m2_repository"
            echo "maven_proxy_url=$PROXY_URL"
          } | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Create cache directories
        run: |
          mkdir -p \
            "${{ steps.vars.outputs.gradle_user_home }}" \
            "${{ steps.vars.outputs.konan_data_dir }}" \
            "${{ steps.vars.outputs.maven_local_repo }}" \
            "${{ steps.vars.outputs.artifact_local_path }}"

      - name: Clean Konan and Maven caches for clean build
        if: steps.vars.outputs.clean_build == 'true'
        env:
          KONAN_DATA_DIR: ${{ steps.vars.outputs.konan_data_dir }}
          MAVEN_LOCAL_REPO: ${{ steps.vars.outputs.maven_local_repo }}
        run: |
          echo "Removing contents of KONAN_DATA_DIR and Maven local repo..."
          rm -rf "$KONAN_DATA_DIR"
          mkdir -p "$KONAN_DATA_DIR"
          rm -rf "$MAVEN_LOCAL_REPO"
          mkdir -p "$MAVEN_LOCAL_REPO"

      - name: Prepare Kotlin repo
        id: kotlin
        uses: ./.github/actions/prepare-repo
        with:
          repo_url: ${{ env.REPO_URL }}
          branch: ${{ steps.vars.outputs.branch }}
          commit: ${{ steps.vars.outputs.commit }}
          pr_number: ${{ steps.vars.outputs.pr_number }}
          workspace_dir: ${{ env.WORKSPACE_DIR }}
          local_reference_dir: ${{ env.LOCAL_REFERENCE_DIR }}

      - name: Configure Maven proxy
        if: steps.vars.outputs.maven_proxy_url != ''
        id: maven_proxy
        env:
          GRADLE_USER_HOME: ${{ steps.vars.outputs.gradle_user_home }}
          MAVEN_PROXY_URL: ${{ steps.vars.outputs.maven_proxy_url }}
          MAVEN_LOCAL_REPO: ${{ steps.vars.outputs.maven_local_repo }}
        run: |
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cp "$GITHUB_WORKSPACE/kn-action/scripts/maven-proxy.init.gradle" "$GRADLE_USER_HOME/init.d/"
          echo "Gradle: init script installed to $GRADLE_USER_HOME/init.d/"

          mkdir -p ~/.m2
          [ -f ~/.m2/settings.xml ] && cp ~/.m2/settings.xml ~/.m2/settings.xml.proxy-bak
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <localRepository>$MAVEN_LOCAL_REPO</localRepository>
            <mirrors><mirror>
              <id>maven-proxy</id><mirrorOf>central</mirrorOf>
              <url>$MAVEN_PROXY_URL</url>
            </mirror></mirrors>
          </settings>
          EOF
          echo "Maven: localRepository=$MAVEN_LOCAL_REPO, mirror=$MAVEN_PROXY_URL"

      - name: Build Kotlin
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ steps.vars.outputs.gradle_user_home }}
          KONAN_DATA_DIR: ${{ steps.vars.outputs.konan_data_dir }}
          DEVELOPER_DIR: ${{ env.DEVELOPER_DIR }}
          JDK_18: ${{ steps.java8.outputs.path }}
        run: |
          cd "${{ env.WORKSPACE_DIR }}"
          bash scripts/build-ohos.sh

      - name: Promote clean build cache to persisted Gradle home
        if: success() && steps.vars.outputs.clean_build == 'true'
        env:
          CI_CACHE_ROOT: ${{ steps.vars.outputs.ci_cache_root }}
          PERSISTED_CACHE_ROOT: ${{ steps.vars.outputs.persisted_cache_root }}
        shell: bash
        run: |
          if [ ! -d "$CI_CACHE_ROOT" ]; then
            echo "Clean cache dir not found, skipping promotion."
            exit 0
          fi
          ls -la "$CI_CACHE_ROOT"

          echo "Removing existing persisted cache at $PERSISTED_CACHE_ROOT"
          rm -rf "$PERSISTED_CACHE_ROOT"
          mkdir -p "$PERSISTED_CACHE_ROOT"

          echo "Moving contents of $CI_CACHE_ROOT to $PERSISTED_CACHE_ROOT"
          mv "$CI_CACHE_ROOT"/* "$PERSISTED_CACHE_ROOT/"

          echo "Clean build cache promoted from $CI_CACHE_ROOT to $PERSISTED_CACHE_ROOT" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Maven settings
        if: always() && steps.maven_proxy.outcome != 'skipped'
        run: |
          if [ -f ~/.m2/settings.xml.proxy-bak ]; then
            mv ~/.m2/settings.xml.proxy-bak ~/.m2/settings.xml
          else
            rm -f ~/.m2/settings.xml
          fi

      - name: Archive build output
        id: archive
        env:
          ARTIFACT_LOCAL_PATH: ${{ steps.vars.outputs.artifact_local_path }}
        run: |
          KOTLIN_SHA="${{ steps.kotlin.outputs.sha }}"
          KOTLIN_SHA_SHORT="${KOTLIN_SHA:0:7}"
          GITHUB_SHA_SHORT="${GITHUB_SHA:0:7}"
          ARCHIVE_NAME="kotlin-${KOTLIN_SHA_SHORT}_act-${GITHUB_SHA_SHORT}_${RUNNER_OS}_${RUNNER_ARCH}.tar.gz"

          OUT_PATH="$ARTIFACT_LOCAL_PATH/$ARCHIVE_NAME"
          tar -cf - -C "${{ env.WORKSPACE_DIR }}" build/repo | gzip -9 > "$OUT_PATH"
          echo "path=$OUT_PATH" >> "$GITHUB_STEP_SUMMARY"
          echo "path=$OUT_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to GitHub
        if: steps.vars.outputs.artifact_destination == 'github'
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-ohos-build-${{ runner.os }}-${{ runner.arch }}
          path: ${{ steps.archive.outputs.path }}
          retention-days: 14

  actions-timeline:
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
    steps:
      - uses: Kesin11/actions-timeline@v3
