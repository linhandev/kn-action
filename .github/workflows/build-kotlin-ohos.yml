# Build Kotlin for OpenHarmony: clone CPF-KMP-CMP/kotlin from GitCode and run scripts/build-ohos.sh
# Target: Mac ARM64 self-hosted runner. Build steps per: linhandev.github.io/_posts/KMP/2026-02-11-Building-Kotlin (mac arm)
# Requires: runner env has GitCode SSH access configured (no secrets used).

name: Build Kotlin (OpenHarmony)

on:
  workflow_dispatch:
  push:
    branches: [develop, main]

env:
  KOTLIN_REPO: git@gitcode.com:CPF-KMP-CMP/kotlin.git
  KOTLIN_BRANCH: main-2.2.21-OH  # branch that has scripts/build-ohos.sh
  KOTLIN_DIR: kotlin

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, kotlin]
    steps:
      - name: Checkout kn-action
        uses: actions/checkout@v4

      - name: Set up Java 8
        id: java8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clone Kotlin repo
        run: |
          git clone --depth 1 --branch "${{ env.KOTLIN_BRANCH }}" "${{ env.KOTLIN_REPO }}" "${{ env.KOTLIN_DIR }}"
          cd "${{ env.KOTLIN_DIR }}" && git rev-parse HEAD

      - name: Build Kotlin (OpenHarmony)
        run: |
          cd "${{ env.KOTLIN_DIR }}"
          export JDK_18="${{ steps.java8.outputs.path }}"
          bash scripts/build-ohos.sh
