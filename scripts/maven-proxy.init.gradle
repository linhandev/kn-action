/*
 * Maven mirror for Gradle (same behavior as pre-refactor cpf-kotlin/scripts/maven-proxy.init.gradle).
 *
 * Before the kotlin repo change, build-ohos.sh passed:
 *   --init-script scripts/maven-proxy.init.gradle  and  -Pmaven.repository.mirror=<url>
 * That script always ran. kn-action also installed this file under GRADLE_USER_HOME/init.d/;
 * the kn-action variant that required MAVEN_PROXY_URL was often a no-op because MAVEN_PROXY_URL
 * was not exported from the shell — the kotlin --init-script path was what actually applied.
 *
 * Mirror URL (first non-blank wins):
 *   -P maven.repository.mirror=...  →  env MAVEN_PROXY_URL  →  default below.
 */

def proxyUrlProp = gradle.startParameter.projectProperties?.get('maven.repository.mirror')
def proxyUrl = proxyUrlProp?.toString()?.trim()
if (!proxyUrl) {
    proxyUrl = System.getenv('MAVEN_PROXY_URL')?.trim()
}
if (!proxyUrl) {
    proxyUrl = 'http://192.168.3.5:8080/releases'
}

println("[maven-proxy] Using mirror → ${proxyUrl}")

/** Do not rewrite mavenLocal() / maven { url = uri("file:...") } to the HTTP proxy. */
def isLocalFileMavenRepo = { repo ->
    if (!(repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository)) {
        return false
    }
    def url = repo.url
    if (url == null) {
        return false
    }
    try {
        def u = url instanceof URI ? url : URI.create(url.toString())
        return 'file'.equalsIgnoreCase(u.scheme)
    } catch (Throwable ignored) {
        return false
    }
}

def rewriteMavenRepoToProxy = { repo ->
    if (!(repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) || isLocalFileMavenRepo(repo)) {
        return
    }
    repo.setUrl(URI.create(proxyUrl))
    repo.setAllowInsecureProtocol(true)
}

// Disable cache-redirector via startParameter for the root build
def props = new HashMap(gradle.startParameter.projectProperties ?: [:])
props.put('cacheRedirectorEnabled', 'false')
gradle.startParameter.setProjectProperties(props)

beforeSettings { settings ->
    settings.pluginManagement {
        repositories {
            clear()
            maven {
                url proxyUrl
                allowInsecureProtocol = true
            }
        }
    }
}

gradle.settingsEvaluated { settings ->
    def sp = new HashMap(settings.startParameter.projectProperties ?: [:])
    sp.put('cacheRedirectorEnabled', 'false')
    settings.startParameter.setProjectProperties(sp)

    // Rewrite every repo URL to the proxy instead of clearing (preserves exclusiveContent rules)
    settings.pluginManagement.repositories.each { repo ->
        if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
            rewriteMavenRepoToProxy(repo)
        }
    }
    try {
        settings.dependencyResolutionManagement.repositories.each { repo ->
            if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
                rewriteMavenRepoToProxy(repo)
            }
        }
    } catch (Throwable ignored) {}
}

gradle.beforeProject { project ->
    try {
        project.repositories.each { repo ->
            if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
                rewriteMavenRepoToProxy(repo)
            }
        }
    } catch (Throwable t) {
        println("[maven-proxy] beforeProject ${project.path}: ${t.message}")
    }
}

gradle.afterProject { project ->
    try {
        project.repositories.each { repo ->
            if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
                rewriteMavenRepoToProxy(repo)
            }
        }
    } catch (Throwable t) {
        println("[maven-proxy] afterProject repos ${project.path}: ${t.message}")
    }
    try {
        project.buildscript.repositories.each { repo ->
            if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
                rewriteMavenRepoToProxy(repo)
            }
        }
    } catch (Throwable ignored) {}
}
