/*
 * When NODEJS_DIST_MIRROR is set, point the Node Gradle plugin's distBaseUrl at that base URL.
 * Layout must match https://nodejs.org/dist/ (e.g. v22.0.0/node-v22.0.0-darwin-x64.tar.gz).
 * LAN: mirror nodejs.org/dist under e.g. http://<reposilite-host>/nodejs-dist (sibling of /releases).
 */

gradle.afterProject { proj ->
    String mirror = System.getenv('NODEJS_DIST_MIRROR')?.trim()
    if (!mirror) {
        return
    }
    def nodeExt = proj.extensions.findByName('node')
    if (nodeExt == null) {
        return
    }
    try {
        nodeExt.distBaseUrl.set(mirror)
    } catch (Throwable ignored) {
        try {
            nodeExt.distBaseUrl = mirror
        } catch (Throwable ignored2) {
            println("[nodejs-dist-mirror] ${proj.path}: could not set distBaseUrl")
        }
    }
}
